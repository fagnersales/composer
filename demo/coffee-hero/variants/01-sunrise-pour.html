<!--variant-meta {"name":"Sunrise Pour","model":"opus-4.8","description":"Warm gradient hero with a pouring-cup animation and floating steam."}-->
<!doctype html><html><head><style>
  *{margin:0;box-sizing:border-box}
  body{height:100vh;display:flex;align-items:center;justify-content:center;gap:8vmin;
    font-family:Georgia,serif;background:linear-gradient(140deg,#2b1608,#7a3d10 55%,#e0862e);
    background-size:180% 180%;animation:bg 9s ease infinite;color:#fff7ee;overflow:hidden}
  @keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .copy{max-width:34ch}
  h1{font-size:clamp(26px,5vmin,54px);line-height:1.1;animation:rise .9s ease both}
  p{margin-top:1em;opacity:.85;font-size:clamp(13px,2vmin,17px);animation:rise .9s .15s ease both}
  .cta{display:inline-block;margin-top:1.6em;background:#fff7ee;color:#5a2c0d;text-decoration:none;
    padding:.8em 1.6em;border-radius:999px;font-weight:700;font-family:sans-serif;font-size:14px;
    animation:rise .9s .3s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .cup{position:relative;width:20vmin;height:14vmin;background:#fff7ee;border-radius:0 0 9vmin 9vmin;
    animation:tilt 3.4s ease-in-out infinite}
  .cup:after{content:"";position:absolute;right:-5vmin;top:1.5vmin;width:6vmin;height:7vmin;
    border:1.6vmin solid #fff7ee;border-radius:50%}
  .coffee{position:absolute;inset:2vmin 2vmin auto;height:3vmin;background:#4a2410;border-radius:50%}
  @keyframes tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
  .steam{position:absolute;left:50%;bottom:105%;width:1.1vmin;height:6vmin;border-radius:999px;
    background:rgba(255,247,238,.5);filter:blur(2px);animation:steam 2.6s ease-in-out infinite}
  .steam.s2{left:32%;animation-delay:.9s}.steam.s3{left:68%;animation-delay:1.7s}
  @keyframes steam{0%{opacity:0;transform:translateY(0) scaleY(.6)}
    40%{opacity:1}100%{opacity:0;transform:translateY(-7vmin) scaleY(1.3)}}
</style></head><body>
  <div class="copy"><h1>Wake up to a fresher pour.</h1>
  <p>Single-origin beans roasted 48 hours before they reach your door. Every week. No decisions required.</p>
  <a class="cta" href="#">Start my subscription</a></div>
  <div class="cup"><span class="steam"></span><span class="steam s2"></span><span class="steam s3"></span><span class="coffee"></span></div>
</body></html>
