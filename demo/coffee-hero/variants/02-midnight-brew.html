<!doctype html><html><head><style>
  *{margin:0;box-sizing:border-box}
  body{height:100vh;background:#0d0b09;color:#efe8db;font-family:Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}
  .ring{position:absolute;right:-14vmin;top:50%;width:56vmin;height:56vmin;margin-top:-28vmin;
    border:1px solid rgba(224,170,90,.35);border-radius:50%;animation:spin 24s linear infinite}
  .ring i{position:absolute;top:-5px;left:50%;width:10px;height:10px;border-radius:50%;background:#e0aa5a}
  @keyframes spin{to{transform:rotate(360deg)}}
  .inner{padding:0 7vmin;z-index:1}
  .kicker{font-size:11px;letter-spacing:.45em;color:#e0aa5a;animation:fade 1s both}
  h1{font-size:clamp(30px,7vmin,74px);font-weight:800;letter-spacing:-.02em;line-height:1.02;
    margin-top:.4em;max-width:12ch;animation:fade 1s .15s both}
  h1 em{font-style:normal;color:#e0aa5a}
  @keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .row{display:flex;gap:12px;margin-top:3.2vmin;animation:fade 1s .3s both}
  .btn{padding:.85em 1.7em;border-radius:6px;font-size:13px;font-weight:700;text-decoration:none}
  .b1{background:#e0aa5a;color:#1a120a}.b2{border:1px solid #3a332a;color:#efe8db}
  .ticker{position:absolute;bottom:0;left:0;right:0;border-top:1px solid #2a241d;padding:12px 0;
    white-space:nowrap;overflow:hidden;font-size:12px;letter-spacing:.2em;color:#8d8272}
  .ticker span{display:inline-block;animation:mq 18s linear infinite}
  @keyframes mq{to{transform:translateX(-50%)}}
</style></head><body>
  <div class="ring"><i></i></div>
  <div class="inner">
    <div class="kicker">EST. MIDNIGHT ROASTERY</div>
    <h1>Coffee for people who <em>read the label.</em></h1>
    <div class="row"><a class="btn b1" href="#">Build my box</a><a class="btn b2" href="#">Taste profiles</a></div>
  </div>
  <div class="ticker"><span>ETHIOPIA GUJI · HONDURAS MARCALA · KENYA NYERI · SUMATRA LINTONG · COLOMBIA HUILA ·
  ETHIOPIA GUJI · HONDURAS MARCALA · KENYA NYERI · SUMATRA LINTONG · COLOMBIA HUILA · </span></div>
</body></html>
