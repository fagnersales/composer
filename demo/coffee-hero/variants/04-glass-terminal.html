<!--variant-meta {"name":"Glass Terminal","model":"haiku-4.5","description":"Techy glassmorphism take — typing terminal that 'orders' your coffee."}-->
<!doctype html><html><head><style>
  *{margin:0;box-sizing:border-box}
  body{height:100vh;display:flex;align-items:center;justify-content:center;gap:6vmin;overflow:hidden;
    font-family:ui-monospace,Menlo,monospace;color:#eaf0ff;
    background:radial-gradient(60vmax 60vmax at 20% 10%,#20305c,#0a0e1c 60%)}
  .blob{position:absolute;width:44vmin;height:44vmin;border-radius:50%;filter:blur(60px);opacity:.5;
    background:#4f6cff;animation:float 11s ease-in-out infinite}
  .blob.b2{background:#9a4fff;right:6%;bottom:4%;animation-delay:-5s}
  @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(6vmin,-4vmin)}}
  .copy{z-index:1;font-family:-apple-system,sans-serif;max-width:32ch}
  h1{font-size:clamp(24px,4.6vmin,46px);line-height:1.12;font-weight:750}
  h1 span{background:linear-gradient(90deg,#7c9cff,#c07cff);-webkit-background-clip:text;color:transparent}
  p{margin-top:1em;color:#9aa6c8;font-size:clamp(12px,1.9vmin,15px)}
  .term{z-index:1;width:min(46vmin,420px);border-radius:14px;overflow:hidden;
    background:rgba(20,26,48,.55);backdrop-filter:blur(14px);border:1px solid rgba(140,160,255,.25);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
  .bar{display:flex;gap:6px;padding:11px 13px;background:rgba(255,255,255,.06)}
  .bar i{width:10px;height:10px;border-radius:50%;background:#ff5f57}
  .bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
  .body{padding:16px;font-size:clamp(10px,1.7vmin,13px);line-height:1.9;color:#b9c6ef}
  .body .ok{color:#5ee08a}.body .cmd{color:#eaf0ff}
  .line{overflow:hidden;white-space:nowrap;width:0;animation:type 1.2s steps(30) forwards}
  .l2{animation-delay:1.4s}.l3{animation-delay:2.8s}.l4{animation-delay:4.2s}
  @keyframes type{to{width:100%}}
  .cursor{display:inline-block;width:.6em;height:1.1em;background:#7c9cff;vertical-align:text-bottom;
    animation:blink 1s steps(1) infinite 5.4s;opacity:0}
  @keyframes blink{50%{opacity:1}}
</style></head><body>
  <div class="blob"></div><div class="blob b2"></div>
  <div class="copy"><h1>Your coffee, <span>on autopilot.</span></h1>
  <p>An API-simple subscription: set your taste once, and fresh beans deploy to your door every week.</p></div>
  <div class="term"><div class="bar"><i></i><i></i><i></i></div>
  <div class="body">
    <div class="line cmd">$ brew subscribe --taste=chocolatey</div>
    <div class="line l2 ok">✓ profile saved: dark · low-acid</div>
    <div class="line l3 cmd">$ brew ship --every=7d</div>
    <div class="line l4 ok">✓ next delivery: Tuesday ☕</div>
    <span class="cursor"></span>
  </div></div>
</body></html>
