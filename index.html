<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Composer</title>
<style>
  /* Geist — nearest neutral grotesque for the Monochrome kit */
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

  /* ===== Monochrome design-system tokens (imported from claude.ai/design) ===== */
  :root {
    /* Neutral ramp — the whole system lives on this */
    --gray-0:#ffffff; --gray-50:#fafafa; --gray-100:#f5f5f5; --gray-150:#ededed;
    --gray-200:#e5e5e5; --gray-300:#d4d4d4; --gray-400:#a3a3a3; --gray-500:#737373;
    --gray-600:#525252; --gray-700:#404040; --gray-800:#262626; --gray-900:#171717; --gray-950:#0a0a0a;
    /* Surfaces */
    --bg-page:var(--gray-0); --bg-subtle:var(--gray-50); --bg-muted:var(--gray-100);
    --bg-surface:var(--gray-0); --bg-inverse:var(--gray-900); --bg-overlay:rgba(10,10,10,.4);
    /* Text */
    --text-primary:var(--gray-900); --text-secondary:var(--gray-500); --text-tertiary:var(--gray-400); --text-inverse:var(--gray-0);
    /* Borders */
    --border-default:var(--gray-200); --border-strong:var(--gray-300); --border-subtle:var(--gray-150);
    /* Accent — ink; the brand color is the absence of color */
    --accent:var(--gray-900); --accent-hover:var(--gray-800); --accent-fg:var(--gray-0);
    /* Theme-tuned extras */
    --ring:rgba(23,23,23,.30); --dot:rgba(10,10,10,.06);
    --edge:rgba(115,115,115,.55); --edge-ghost:rgba(115,115,115,.30);
    --input-glow:var(--gray-150); --pill-active:var(--bg-surface);
    /* Radii */
    --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:20px; --radius-full:999px;
    /* Shadows — whispers */
    --shadow-sm:0 1px 3px rgba(10,10,10,.06),0 1px 2px rgba(10,10,10,.04);
    --shadow-md:0 4px 12px rgba(10,10,10,.08);
    --shadow-lg:0 12px 32px rgba(10,10,10,.12);
    --shadow-pop:0 24px 48px -12px rgba(10,10,10,.18);
    /* Motion */
    --ease-out:cubic-bezier(.16,1,.3,1); --dur-fast:120ms; --dur-base:200ms; --dur-snap:290ms;
    /* Type */
    --font-sans:'Geist',ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:'Geist Mono','SF Mono','Menlo',monospace;
    --weight-medium:500; --weight-semibold:600; --weight-bold:700;
    --tracking-normal:-.01em; --tracking-heading:-.02em;
    --text-xs:12px; --text-sm:13px; --text-md:14px; --text-lg:16px;
    color-scheme:light;
    /* Counter ladder — 12 perceptually even achromatic stops. The brand colour
       is the absence of colour, so magnitude grades along luminance alone: on
       white the ramp runs pale → ink. */
    --lum-1:oklch(.680 0 0);  --lum-2:oklch(.631 0 0);  --lum-3:oklch(.582 0 0);
    --lum-4:oklch(.533 0 0);  --lum-5:oklch(.484 0 0);  --lum-6:oklch(.435 0 0);
    --lum-7:oklch(.385 0 0);  --lum-8:oklch(.336 0 0);  --lum-9:oklch(.287 0 0);
    --lum-10:oklch(.238 0 0); --lum-11:oklch(.189 0 0); --lum-12:oklch(.140 0 0);
    --rung-off:oklch(.885 0 0);
    --rung-glow:rgba(10,10,10,.30);
    /* the inspect island's glass */
    --glass-bg:rgba(255,255,255,.62); --glass-bg-solid:rgba(255,255,255,.94);
    --glow-rgb:10,10,10;
  }
  @property --k { syntax: '<number>'; inherits: false; initial-value: 0; }
  [data-theme="dark"] {
    --bg-page:#0a0a0a; --bg-subtle:#141414; --bg-muted:#1f1f1f; --bg-surface:#141414;
    --bg-inverse:#fafafa; --bg-overlay:rgba(0,0,0,.6);
    --text-primary:#f5f5f5; --text-secondary:#a3a3a3; --text-tertiary:#737373; --text-inverse:#171717;
    --border-default:#262626; --border-strong:#404040; --border-subtle:#1f1f1f;
    --accent:#f5f5f5; --accent-hover:#ffffff; --accent-fg:#171717;
    --ring:rgba(245,245,245,.5); --dot:rgba(255,255,255,.05);
    --edge:rgba(163,163,163,.45); --edge-ghost:rgba(163,163,163,.26);
    --input-glow:var(--gray-800); --pill-active:var(--gray-700);
    color-scheme:dark;
    --lum-1:oklch(.580 0 0);  --lum-2:oklch(.617 0 0);  --lum-3:oklch(.655 0 0);
    --lum-4:oklch(.692 0 0);  --lum-5:oklch(.729 0 0);  --lum-6:oklch(.766 0 0);
    --lum-7:oklch(.804 0 0);  --lum-8:oklch(.841 0 0);  --lum-9:oklch(.878 0 0);
    --lum-10:oklch(.915 0 0); --lum-11:oklch(.953 0 0); --lum-12:oklch(.990 0 0);
    --rung-off:oklch(.300 0 0);
    --rung-glow:rgba(255,255,255,.34);
    --glass-bg:rgba(20,20,20,.55); --glass-bg-solid:rgba(20,20,20,.9);
    --glow-rgb:255,255,255;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-page); color: var(--text-primary); overflow: hidden;
    letter-spacing: var(--tracking-normal);
    -webkit-font-smoothing: antialiased;
    transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
  }

  /* canvas + world */
  #canvas {
    position: fixed; inset: 0; overflow: hidden;
    background-color: var(--bg-page);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 40px 40px;
    cursor: grab;
  }
  #canvas:active { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }

  #edges { position: absolute; left: 0; top: 0; width: 10px; height: 10px; overflow: visible; pointer-events: none; }
  #edges .edge { fill: none; stroke: var(--edge); stroke-width: 2; }
  #edges .edge.ghostly { stroke-dasharray: 6 6; stroke: var(--edge-ghost); }

  /* node */
  .node {
    position: absolute; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-lg);
    cursor: grab; user-select: none;
    box-shadow: var(--shadow-md);
    transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  .node:hover { border-color: var(--border-strong); }
  .node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--ring), var(--shadow-lg); }
  .node.winner { border-color: var(--accent); }
  .node.building { cursor: default; border-style: dashed; border-color: var(--border-strong); animation: pulse 1.6s ease-in-out infinite; }
  .node .preview {
    /* width: auto, not 300px — the node is border-box, so a hard 300 overflows
       its content box by the two 1px borders and the opaque iframe paints over
       the right border and the top-right arc */
    width: auto; height: 169px; overflow: hidden; position: relative; background: var(--bg-page);
    /* overflow:hidden alone doesn't clip the composited (scaled) iframe layer,
       so its square corners paint over the card's rounded border at high zoom */
    clip-path: inset(0 round 13px 13px 0 0);
  }
  .node .scaler { width: 1200px; height: 675px; transform: scale(.25); transform-origin: top left; }
  .node iframe { width: 1200px; height: 675px; border: 0; pointer-events: none; background: #000; }
  .node .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; }
  .node .ttl { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .node .nm { font-size: 12.5px; color: var(--text-primary); font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .mdl { display: flex; align-items: center; gap: 5px; flex: none; font-size: 10.5px; color: var(--text-secondary); }
  .node .mdl i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  /* the crown rides the title, not the preview — nothing overlaps the variant */
  .node .crown { color: var(--accent); font-size: 13px; line-height: 1; flex: none; display: none; }
  .node.winner .crown { display: block; }
  .node .build {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; background: var(--bg-subtle); color: var(--text-secondary); font-size: 12px;
    border-radius: 13px;
  }
  .node.building .build { display: flex; }
  .node .build .req { max-width: 250px; text-align: center; color: var(--text-tertiary); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .build .cancel {
    margin-top: 2px; padding: 5px 14px; border-radius: var(--radius-full);
    border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-secondary);
    cursor: pointer; font-size: 11px; font-family: var(--font-sans); font-weight: var(--weight-medium);
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .node .build .cancel:hover { background: var(--bg-subtle); border-color: var(--border-strong); color: var(--text-primary); }
  .node .spin { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(128,128,128,0); } 50% { box-shadow: 0 0 0 3px var(--ring); } }

  /* hud */
  #hud { position: fixed; top: 14px; left: 16px; z-index: 20; font-size: 12px; color: var(--text-secondary); pointer-events: none; display: flex; align-items: center; }
  #hud b { color: var(--text-primary); font-weight: var(--weight-semibold); }
  #hud a { color: inherit; text-decoration: none; pointer-events: auto; }
  #hud a:hover { text-decoration: underline; }
  #sessName { color: var(--text-secondary); }
  #taskSel {
    pointer-events: auto; appearance: none; -webkit-appearance: none; max-width: 320px;
    background: transparent; border: 0; border-bottom: 1px dashed var(--border-strong);
    color: var(--text-primary); font: inherit; cursor: pointer; padding: 0 2px; outline: none;
  }
  #live { color: var(--text-primary); font-weight: var(--weight-medium); }
  #live.off { color: var(--text-tertiary); }

  /* toolbar */
  #toolbar { position: fixed; left: 16px; bottom: 16px; z-index: 20; display: flex; gap: 6px; }
  #toolbar button {
    min-width: 36px; height: 36px; padding: 0 14px; border-radius: var(--radius-full); border: 1px solid var(--border-default);
    background: var(--bg-surface); color: var(--text-primary); cursor: pointer; font-size: 15px; font-family: var(--font-sans);
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  #toolbar button:hover { background: var(--bg-subtle); border-color: var(--border-strong); }
  #toolbar button:active { transform: scale(.97); }

  /* theme toggle */
  #themeToggle {
    position: fixed; top: 12px; right: 16px; z-index: 20; width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-default); border-radius: var(--radius-full);
    background: var(--bg-surface); color: var(--text-secondary); cursor: pointer; font-size: 15px;
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  #themeToggle:hover { background: var(--bg-subtle); border-color: var(--border-strong); color: var(--text-primary); }

  /* minimap — a HUD chip; kept on a fixed dark surface so its marks stay legible in both themes */
  #minimap { position: fixed; right: 16px; bottom: 16px; z-index: 20; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: rgba(10,10,10,.82); display: block; box-shadow: var(--shadow-md); }

  /* reject — a card marked as a dead end. It keeps its place: a low-alpha red
     wash falls over the preview, the content desaturates, the border goes soft
     red, and a small badge names the state. */
  .node.rejected { border-color: rgba(229,72,77,.55); box-shadow: var(--shadow-sm); }
  .node.rejected .preview .scaler { filter: grayscale(.7) brightness(.82) contrast(.92); opacity: .78; }
  .node.rejected .preview::after {
    content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: rgba(229,72,77,.14); clip-path: inset(0 round 13px 13px 0 0);
  }
  .node.rejected .nm { color: var(--text-tertiary); }
  .node.rejected.selected { border-color: rgba(229,72,77,.8); box-shadow: 0 0 0 2px rgba(229,72,77,.35), var(--shadow-lg); }
  .rej-badge {
    position: absolute; top: 8px; left: 8px; z-index: 3; display: none;
    align-items: center; gap: 4px; padding: 3px 8px; border-radius: var(--radius-full);
    background: rgba(229,72,77,.16); color: #e5484d; border: 1px solid rgba(229,72,77,.4);
    font-size: 10px; font-weight: var(--weight-semibold); letter-spacing: .01em;
    pointer-events: none; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .node.rejected .rej-badge { display: inline-flex; }
  .rej-badge i { width: 5px; height: 5px; border-radius: 50%; background: #e5484d; }
  #edges .edge.dim { stroke: rgba(229,72,77,.32); opacity: .5; }
  /* the card's own Reject control — rides the foot, appears on hover / selection */
  .node .rejbtn {
    flex: none; width: 22px; height: 22px; padding: 0; margin-left: 2px;
    display: none; align-items: center; justify-content: center;
    border: 1px solid var(--border-default); border-radius: var(--radius-full);
    background: var(--bg-surface); color: var(--text-tertiary); cursor: pointer;
    font-size: 11px; line-height: 1; font-family: var(--font-sans);
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .node:hover .rejbtn, .node.selected .rejbtn { display: inline-flex; }
  .node .rejbtn:hover { color: #e5484d; border-color: rgba(229,72,77,.55); background: rgba(229,72,77,.08); }
  .node.rejected .rejbtn { color: #e5484d; border-color: rgba(229,72,77,.5); display: inline-flex; }
  .node.rejected .rejbtn:hover { background: rgba(229,72,77,.12); }
  .node .rejbtn svg { width: 12px; height: 12px; }

  /* composer */
  /* Two states, one motion: a bare 292px chip at rest, a 412px textarea while
     composing. Everything explanatory (keycap hint, note row) belongs to the
     composing state or to a confirmation — the resting chip is only what you
     can operate, so its bottom edge sits right under the buttons. The resting
     width is measured, not chosen: the counter pill + ladder + Iterate button
     lay out at their natural size, and the note line reads unclipped. */
  #composer {
    position: fixed; z-index: 25; width: 292px; background: var(--bg-surface); border: 1px solid var(--border-default);
    border-radius: var(--radius-lg); padding: 12px; box-shadow: var(--shadow-pop); font-size: 12px;
    transition: width var(--dur-snap) var(--ease-out), box-shadow var(--dur-snap) var(--ease-out),
                border-color var(--dur-snap) var(--ease-out);
  }
  #composer.composing { width: 412px; border-color: var(--border-strong); }

  /* the panel opens straight onto the mode toggle — the selection ring already
     says which node this is about, so there is no title line */
  #cmpMode { display: flex; gap: 2px; padding: 3px; background: var(--bg-muted); border-radius: var(--radius-full); margin-bottom: 9px; }
  #cmpMode button {
    flex: 1; height: 26px; border-radius: var(--radius-full); border: none; background: none;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    color: var(--text-secondary); cursor: pointer; font-size: 12px; font-family: var(--font-sans); font-weight: var(--weight-medium);
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  /* the glyph carries the idea (branch out / nudge one setting) at the weight of
     a label, so it stays legible against the pill and never outshouts the word */
  #cmpMode button svg { width: 12px; height: 12px; flex: none; opacity: .75; transition: opacity var(--dur-fast) var(--ease-out); }
  #cmpMode button.on svg, #cmpMode button:hover:not(:disabled) svg { opacity: 1; }
  #cmpMode button:hover:not(:disabled) { color: var(--text-primary); }
  #cmpMode button.on { background: var(--pill-active); color: var(--text-primary); box-shadow: var(--shadow-sm); font-weight: var(--weight-semibold); }
  #cmpMode button:disabled { opacity: .35; cursor: default; }
  /* Reject rides the mode track as a full equal third segment — same size and
     type as Iterate/Tweak, but its accent is soft red; once the selected card
     is rejected it stays red-tinted and reads "Rescue" */
  #cmpMode #cmpReject { display: none; }
  #composer.show-reject #cmpMode #cmpReject { display: flex; }
  #cmpMode #cmpReject:hover:not(:disabled) { color: #e5484d; background: rgba(229,72,77,.10); }
  #cmpMode #cmpReject:hover:not(:disabled) svg { opacity: 1; }
  #cmpMode #cmpReject.is-rejected { color: #e5484d; background: rgba(229,72,77,.15); box-shadow: var(--shadow-sm); font-weight: var(--weight-semibold); }
  #cmpMode #cmpReject.is-rejected svg { opacity: 1; }
  #cmpMode #cmpReject.is-rejected:hover:not(:disabled) { background: rgba(229,72,77,.22); }
  #cmpMode #cmpReject .undo { display: none; }
  #cmpMode #cmpReject.is-rejected .ban { display: none; }
  #cmpMode #cmpReject.is-rejected .undo { display: inline; }
  /* Reject/Rescue share the wider word's width so the flip never shifts layout */
  #cmpMode #cmpReject .lbl { min-width: 43px; text-align: left; }

  /* Reference images (pasted / dropped) ride above the field as thumbnails.
     The row reserves no space until something is attached. */
  .cmp-imgs { display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #composer.has-imgs .cmp-imgs { display: flex; }
  .cmp-img {
    position: relative; width: 44px; height: 44px; flex: none;
    border: 1px solid var(--border-default); border-radius: var(--radius-sm);
    overflow: hidden; background: var(--bg-muted);
  }
  .cmp-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cmp-img.pending img { opacity: .35; }
  .cmp-img .up {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  }
  .cmp-img.pending .up { display: flex; }
  .cmp-img .up i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .cmp-img .rm {
    position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; padding: 0;
    border: 0; border-radius: var(--radius-full); background: var(--bg-inverse); color: var(--text-inverse);
    font-size: 9px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity var(--dur-fast) var(--ease-out);
  }
  .cmp-img:hover .rm { opacity: 1; }
  #cmpField.dropping { border-color: var(--gray-400); box-shadow: 0 0 0 3px var(--input-glow); }

  /* The wrapper owns the height transition and clips; the textarea inside snaps
     straight to its final box with no transition of its own. Animating the
     textarea itself makes the browser chase the caret and re-clamp scrollTop on
     every frame of the ease, which reads as a flicker on each new line. */
  #cmpField {
    position: relative; height: 32px; background: var(--bg-page); overflow: hidden;
    border: 1px solid var(--border-default); border-radius: var(--radius-md);
    transition: height var(--dur-snap) var(--ease-out), border-color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out), background var(--dur-base) var(--ease-out);
  }
  #composer.composing #cmpField { height: var(--cmp-fh, 108px); background: var(--bg-subtle); }
  /* growth past the snap is deliberately quieter — the snap stays the moment */
  #composer.composing.settled #cmpField { transition: height 170ms var(--ease-out), border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
  #cmpField:hover { border-color: var(--border-strong); }
  #cmpField.hot { border-color: var(--gray-400); box-shadow: 0 0 0 3px var(--input-glow); }
  #cmpInput, #cmpMirror {
    font-size: 12px; font-family: var(--font-sans); line-height: 17px; padding: 7px 10px;
    white-space: pre; overflow-wrap: normal; word-break: normal;
  }
  /* the hint floats over the bottom-right corner — reserve a gutter under the
     text so the last line never lands beneath it */
  #composer.composing #cmpInput, #composer.composing #cmpMirror {
    white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word;
    padding-bottom: 25px;
  }
  #cmpInput {
    position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box;
    margin: 0; border: 0; outline: none; background: transparent; resize: none; overflow: hidden;
    color: var(--text-primary); display: block;
  }
  #composer.composing #cmpInput { overflow-y: auto; }
  #cmpInput::placeholder { color: var(--text-tertiary); }
  /* measured off-screen so the live field's height is only ever written once */
  #cmpMirror { position: absolute; left: 0; right: 0; top: 0; height: auto; visibility: hidden; pointer-events: none; }

  /* drawn, never a glyph — ⇧ / ↵ can't be trusted to render without a webfont */
  kbd.kb {
    display: inline-flex; align-items: center; justify-content: center;
    height: 15px; min-width: 15px; padding: 0 3px; box-sizing: border-box;
    background: var(--bg-muted); border: 1px solid var(--border-default);
    border-radius: var(--radius-sm); color: var(--text-tertiary);
    vertical-align: middle; line-height: 0; font: inherit;
  }
  kbd.kb + kbd.kb { margin-left: 3px; }
  kbd.kb > svg { display: block; width: 11px; height: 11px; flex: none; }
  kbd.kb.txt { padding: 0 4px; font-family: var(--font-sans); font-size: 9px; line-height: 1; font-weight: var(--weight-medium); color: var(--text-secondary); }
  .cmp-hint {
    position: absolute; right: 0; bottom: 0; z-index: 2;
    padding: 5px 9px 6px 20px;
    /* scrim, so lines scrolling past the bottom edge don't read through it */
    background: linear-gradient(to right, transparent, var(--bg-subtle) 18px);
    display: inline-flex; align-items: center; font-size: 10px; line-height: 15px;
    color: var(--text-tertiary); pointer-events: none;
    opacity: 0; transform: translateY(3px);
    /* leaving is quick and undelayed, so it's gone before the field collapses
       back onto one line and can't smear over the placeholder */
    transition: opacity 110ms var(--ease-out), transform 110ms var(--ease-out);
  }
  #composer.composing .cmp-hint { opacity: 1; transform: none; transition: opacity 180ms var(--ease-out) 90ms, transform 180ms var(--ease-out) 90ms; }
  .cmp-hint .lbl { margin-left: 6px; }

  /* ---------- the model dial ----------
     Which model builds the variants. It is not a control-row button: it's a
     word set into the writing surface, with that model's own small mark beside
     it. The wrapper exists only so the popover can hang off the trigger — the
     field itself clips (it has to, for the scrolling textarea), so the card
     could never escape from inside it. */
  #cmpFieldWrap { position: relative; }
  .dialhost { position: absolute; left: 0; bottom: 0; z-index: 3; }
  /* at rest the field is one line, so the dial rides its right edge instead —
     the model stays readable without opening the panel */
  #composer:not(.composing) .dialhost { left: auto; right: 0; top: 0; bottom: 0; }
  #cmpDial {
    position: relative; z-index: 3;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 10px 6px 9px; border: 0; border-radius: 0 var(--radius-sm) 0 var(--radius-md);
    background: linear-gradient(to left, transparent, var(--bg-subtle) 16px);
    font-family: var(--font-sans); font-size: 10px; line-height: 15px; letter-spacing: .01em;
    color: var(--text-tertiary); cursor: pointer;
    transition: color var(--dur-fast) var(--ease-out), opacity 110ms var(--ease-out), transform 110ms var(--ease-out);
  }
  #composer:not(.composing) #cmpDial {
    height: 100%; padding: 0 10px 0 18px; border-radius: 0 var(--radius-md) var(--radius-md) 0;
    background: linear-gradient(to right, transparent, var(--bg-page) 16px);
  }
  #cmpDial:hover, #cmpDial:focus-visible { color: var(--text-secondary); outline: none; }
  /* while the card is up the trigger stays put and reads as pressed */
  #composer.dialopen #cmpDial { background-image: none; background-color: var(--bg-muted); border-radius: var(--radius-sm); }
  #cmpDial .nm { font-weight: var(--weight-medium); color: var(--text-secondary); transition: color var(--dur-fast) var(--ease-out); }
  #cmpDial:hover .nm, #composer.dialopen #cmpDial .nm { color: var(--text-primary); }
  /* the emblem is an identity mark, not a magnitude read-out: three figures of
     deliberately equal ink, so the glyph says *which* model, never *how much* */
  .emblem { display: inline-flex; width: 12px; height: 12px; flex: none; }
  .emblem svg {
    width: 12px; height: 12px; display: block; overflow: visible; color: var(--text-tertiary);
    transition: color var(--dur-fast) var(--ease-out), transform 220ms var(--ease-out);
  }
  #cmpDial:hover .emblem svg, #composer.dialopen #cmpDial .emblem svg { color: var(--text-primary); }
  .emblem svg.swap { animation: emb 260ms var(--ease-out); }
  @keyframes emb { from { opacity: 0; transform: scale(.72) } to { opacity: 1; transform: none } }

  /* the card — an elevated surface rising just above the trigger, left-aligned
     to it, 6px of air between. Nothing in the panel moves. */
  #cmpPop {
    position: absolute; left: 0; bottom: calc(100% + 6px); z-index: 12; width: 186px;
    background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop); padding: 4px; display: none; transform-origin: bottom left;
  }
  #composer.dialopen #cmpPop { display: block; animation: cmpPop 200ms var(--ease-out); }
  @keyframes cmpPop { from { opacity: 0; transform: translateY(6px) scale(.94) } to { opacity: 1; transform: none } }
  #cmpPop button {
    display: flex; width: 100%; align-items: center; gap: 8px; padding: 6px 8px; border: 0; background: none;
    border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-sans); font-size: 12px;
    color: var(--text-secondary); transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  #cmpPop button:hover { background: var(--bg-muted); color: var(--text-primary); }
  #cmpPop button.on { color: var(--text-primary); font-weight: var(--weight-semibold); }
  #cmpPop button .emblem svg { color: var(--text-tertiary); }
  #cmpPop button:hover .emblem svg, #cmpPop button.on .emblem svg { color: var(--text-primary); }
  #cmpPop button .sub { margin-left: auto; font-size: 10px; color: var(--text-tertiary); font-weight: 400; }
  #cmpPop button .tick { width: 10px; height: 10px; flex: none; opacity: 0; color: var(--text-primary); }
  #cmpPop button.on .tick { opacity: 1; }
  #cmpPop button .tick svg { width: 10px; height: 10px; display: block; }
  #cmpInline {
    flex: 1 1 auto; min-width: 0; color: var(--text-secondary); line-height: 17px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transform: translateX(-6px);
    transition: opacity 180ms var(--ease-out), transform 220ms var(--ease-out);
  }
  #composer.composing #cmpInline { opacity: 1; transform: none; transition-delay: 110ms; }
  .cmp-spacer { flex: 1 1 auto; }
  #composer.composing .cmp-spacer { display: none; }
  .cmp-row { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  #cmpCount { position: relative; display: flex; align-items: center; gap: 2px; padding: 3px; background: var(--bg-muted); border-radius: var(--radius-full); }
  #cmpCount button { position: relative; width: 26px; height: 26px; border-radius: var(--radius-full); border: none; background: none; color: var(--text-secondary); cursor: pointer; font-size: 14px; line-height: 1; font-family: var(--font-sans); font-weight: var(--weight-medium); transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform 90ms var(--ease-out); -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #cmpCount button:hover:not(.off) { background: var(--pill-active); color: var(--text-primary); }
  #cmpCount button:active:not(.off) { transform: scale(.9); }
  /* `.off`, not [disabled]: at the wall the button still says something (that it
     IS the wall), so it stays a real control and only *looks* spent. */
  #cmpCount button.off { opacity: .35; cursor: default; }
  /* the numeral: a real number input kept for typing/focus/a11y, with the
     odometer drum painted over it */
  #cmpNWrap { position: relative; width: 34px; height: 26px; flex: none; }
  #cmpN {
    position: absolute; inset: 0; z-index: 2;
    width: 34px; height: 26px; padding: 0; border: none; background: none; text-align: center; outline: none;
    color: transparent; caret-color: transparent; font-size: 12px; font-family: var(--font-sans); font-weight: var(--weight-semibold);
    -moz-appearance: textfield; border-radius: var(--radius-full);
  }
  #cmpN::-webkit-outer-spin-button, #cmpN::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #cmpN::selection { background: transparent; }
  #cmpN:focus { background: var(--pill-active); border-radius: var(--radius-full); box-shadow: var(--shadow-sm); }
  #odo {
    position: absolute; inset: 0; z-index: 3; pointer-events: none; height: 26px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-family: var(--font-sans); font-weight: var(--weight-semibold);
    font-variant-numeric: tabular-nums; color: var(--text-primary);
  }
  .slot { position: relative; width: 8px; height: 16px; overflow: hidden; transition: width 240ms var(--ease-out); }
  .slot.empty { width: 0; }
  .slot .d { position: absolute; left: 0; top: 0; width: 8px; height: 16px; display: flex; align-items: center; justify-content: center; line-height: 16px; will-change: transform, opacity; }
  /* wheel shading — the top and bottom of the drum fall away while it rolls */
  #odo::before, #odo::after { content: ''; position: absolute; left: 0; right: 0; height: 5px; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 200ms var(--ease-out); }
  #odo::before { top: 5px; background: linear-gradient(var(--bg-muted), transparent); }
  #odo::after { bottom: 5px; background: linear-gradient(transparent, var(--bg-muted)); }
  #cmpCount.rolling #odo::before, #cmpCount.rolling #odo::after { opacity: 1; }
  #cmpCount.rolling #cmpN:focus + #odo::before { background: linear-gradient(var(--pill-active), transparent); }
  /* rubber band at the wall */
  @keyframes wallR { 0%{transform:translateX(0)} 22%{transform:translateX(4px)} 48%{transform:translateX(-2px)} 72%{transform:translateX(1px)} 100%{transform:translateX(0)} }
  @keyframes wallL { 0%{transform:translateX(0)} 22%{transform:translateX(-4px)} 48%{transform:translateX(2px)} 72%{transform:translateX(-1px)} 100%{transform:translateX(0)} }
  #cmpCount.wall-hi { animation: wallR 300ms cubic-bezier(.3,.9,.3,1); }
  #cmpCount.wall-lo { animation: wallL 300ms cubic-bezier(.3,.9,.3,1); }
  /* the ladder — 12 rungs beside the pill, rung N owning luminance stop N, so
     the count is a standing read-out and not just a digit. `--k` is how far each
     *filled* rung is pushed from the unfilled grey toward its own stop, so
     raising the count re-grades the whole stack at once. With no hue to lean on,
     every achromatic cue is load-bearing: a steeper height ramp, a bar that
     thickens as it climbs, a hard fill/empty opacity cliff, and a bloom only the
     top third of the ladder can earn. */
  /* Its own object, outside the counter pill: the pill is what you operate, the
     ladder is what it reads out — so it sits on the panel, unbacked. */
  #ladder { display: flex; align-items: flex-end; gap: 3px; height: 16px; flex: none; margin: 0; opacity: .7; pointer-events: none; transition: opacity 220ms var(--ease-out); }
  #ladder.lit { opacity: 1; }
  #ladder i {
    display: block; border-radius: 1px;
    --k: 0; --g: 0; --c: var(--rung-off);
    background: color-mix(in oklab, var(--c) calc(var(--k) * 100%), var(--rung-off));
    box-shadow: 0 0 calc(2px + 5px * var(--g)) color-mix(in oklab, var(--rung-glow) calc(var(--k) * var(--g) * 90%), transparent);
    transition: --k 260ms var(--ease-out), transform 200ms var(--ease-out), box-shadow 240ms var(--ease-out), opacity 200ms var(--ease-out);
    transform-origin: bottom center;
  }
  #ladder i.past { opacity: .92; }
  #ladder i.on { transform: scaleY(1.32) scaleX(1.45); box-shadow: 0 0 calc(3px + 6px * var(--g)) color-mix(in oklab, var(--rung-glow) calc(var(--k) * (var(--g) * 0.7 + 0.3) * 100%), transparent); }
  #ladder i.off { opacity: .38; box-shadow: none; }
  /* at the wall only the struck rung goes slack — the stack keeps its grade, so
     hitting the ceiling at 12 doesn't momentarily flatten the whole read-out */
  #ladder.wall i.on { box-shadow: none; transform: scaleY(1) scaleX(1); opacity: .45; }
  #cmpGo { height: 32px; padding: 0 16px; border-radius: var(--radius-full); border: 0; background: var(--accent); color: var(--accent-fg); font-weight: var(--weight-medium); font-family: var(--font-sans); font-size: 12px; cursor: pointer; transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  #cmpGo:hover { background: var(--accent-hover); }
  #cmpGo:active { transform: scale(.98); }
  /* Reserves no row at rest — a zero-height sliver that opens only when there
     is something to say, on the panel's own curve, then collapses back to bare. */
  .cmp-note {
    height: 0; margin-top: 0; overflow: hidden; color: var(--text-secondary);
    line-height: 17px; white-space: nowrap; text-overflow: ellipsis;
    opacity: 0; transform: translateY(-3px);
    transition: height var(--dur-snap) var(--ease-out), margin-top var(--dur-snap) var(--ease-out),
                opacity 170ms var(--ease-out), transform var(--dur-snap) var(--ease-out);
  }
  #composer.noted .cmp-note { height: 17px; margin-top: 7px; opacity: 1; transform: none; }
  .cmp-note .dot { display: inline-block; width: 5px; height: 5px; border-radius: var(--radius-full); background: var(--text-primary); vertical-align: 1px; margin-right: 6px; }
  #cmpGo { flex: none; }
  #cmpGo:disabled { opacity: .45; cursor: default; }
  #composer.offline #cmpField, #composer.offline #cmpCount, #composer.offline #ladder, #composer.offline #cmpMode,
  #composer.offline .dialhost { opacity: .5; pointer-events: none; }
  /* multi-select: the panel would sit on top of the very nodes being combined,
     so it leaves the canvas and floats fixed at the bottom instead */
  #composer.at-bottom {
    left: 50%; top: auto; bottom: 18px; transform: translateX(-50%);
  }
  /* docked inside the inspect overlay: the Input lives INSIDE the glass island,
     above the bar — one object growing taller, not a second panel */
  #composer.in-inspect {
    position: static; width: auto; transform: none;
    background: transparent; border: 0; border-radius: 0;
    box-shadow: none; padding: 14px 14px 10px;
  }
  #composer.in-inspect.composing { width: auto; }
  /* the count already lives in the island's bar — never twice */
  #composer.in-inspect #cmpCount, #composer.in-inspect #ladder { display: none; }
  @media (prefers-reduced-motion: reduce) {
    #composer, #cmpField, .cmp-note, .cmp-hint, #cmpInline { transition: none !important; }
    #cmpCount.wall-hi, #cmpCount.wall-lo { animation: none; }
    .slot, #ladder, #ladder i { transition-duration: 1ms; }
    /* no travelling wave: the whole stack re-grades in one snap */
    #ladder i { transition-delay: 0ms !important; }
  }

  /* ---------- inspect overlay ----------
     Three states of one glass object. Away: only the scrim and the framed
     variant — no chrome at all. Gathered (pointer near the bottom or a side
     edge): the island bar materialises — ladder at the left, icon cluster dead
     centre, Pick at the right — and tall chevron zones wake at the screen's
     far edges. Grown: the Input docks into the island above the bar. */
  #inspect { position: fixed; inset: 0; z-index: 40; background: var(--bg-overlay); -webkit-backdrop-filter: blur(10px) saturate(.9); backdrop-filter: blur(10px) saturate(.9); animation: inspFade var(--dur-base) var(--ease-out); }
  #inspect.scrubbing { cursor: ew-resize; -webkit-user-select: none; user-select: none; }
  .insp-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 44px; transition: padding var(--dur-snap) var(--ease-out); }
  #inspect.grown .insp-stage { padding-bottom: 150px; }
  .insp-frame {
    position: relative; background: #000; border-radius: var(--radius-lg); overflow: hidden;
    box-shadow: 0 30px 90px rgba(10,10,10,.5);
    aspect-ratio: var(--ar, 16/9);
    height: min(100%, calc((100vw - 88px) / var(--arn, 1.7778)));
    width: auto; max-width: 100%;
    transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
  }
  .insp-frame iframe { position: absolute; inset: 0; display: block; border: 0; width: 100%; height: 100%; }
  /* the slide-and-fade that sells a variant change */
  .insp-frame.slip-left  { opacity: 0; transform: translateX(-18px); transition: none; }
  .insp-frame.slip-right { opacity: 0; transform: translateX(18px); transition: none; }
  .insp-paused { position: absolute; top: 58px; left: 58px; z-index: 3; background: var(--bg-inverse); color: var(--text-inverse); font-size: 12px; font-weight: var(--weight-semibold); padding: 6px 12px; border-radius: var(--radius-full); box-shadow: var(--shadow-md); }
  #ispFrame:fullscreen { width: 100vw !important; height: 100vh !important; border-radius: 0; }
  #ispFrame:-webkit-full-screen { width: 100vw !important; height: 100vh !important; border-radius: 0; }
  @keyframes inspFade { from { opacity: 0; } }

  /* navigation — two tall quiet hit zones at the screen's far edges; a single
     chevron each, at the edge of perception until that half is hovered */
  .insp-nav {
    position: absolute; top: 0; bottom: 0; width: 64px; z-index: 44;
    border: 0; padding: 0; margin: 0; appearance: none; background: transparent; cursor: pointer;
    display: grid; place-items: center; color: var(--text-primary);
    opacity: 0; pointer-events: none; transition: opacity var(--dur-base) var(--ease-out);
  }
  .insp-nav.prev { left: 0; }
  .insp-nav.next { right: 0; }
  #inspect.gathered .insp-nav, #inspect.grown .insp-nav { opacity: 1; pointer-events: auto; }
  .insp-nav::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity var(--dur-base) var(--ease-out); pointer-events: none; }
  .insp-nav.prev::before { background: linear-gradient(to right, rgba(var(--glow-rgb),.055), rgba(var(--glow-rgb),0) 82%); }
  .insp-nav.next::before { background: linear-gradient(to left,  rgba(var(--glow-rgb),.055), rgba(var(--glow-rgb),0) 82%); }
  .insp-nav:hover:not(:disabled)::before { opacity: 1; }
  .insp-nav svg { width: 22px; height: 22px; position: relative; opacity: .25; filter: drop-shadow(0 1px 3px rgba(10,10,10,.6)); transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-snap) var(--ease-out); }
  .insp-nav.prev svg { transform: translateX(2px); }
  .insp-nav.next svg { transform: translateX(-2px); }
  .insp-nav:hover:not(:disabled) svg { opacity: 1; }
  .insp-nav.prev:hover:not(:disabled) svg { transform: translateX(-2px); }
  .insp-nav.next:hover:not(:disabled) svg { transform: translateX(2px); }
  .insp-nav:active:not(:disabled) svg { transform: scale(.9); }
  /* the ends are walls, not a wrap — the zone goes dead and dim */
  .insp-nav:disabled { cursor: default; }
  .insp-nav:disabled svg { opacity: .07; }

  /* the sensing regions: a bottom band plus a strip down each vertical edge —
     invisible, click-inert, they only wake the chrome */
  .insp-zone { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; z-index: 42; }
  .insp-wake { position: absolute; top: 0; bottom: 0; width: 88px; z-index: 41; }
  .insp-wake.left { left: 0; }
  .insp-wake.right { right: 0; }
  #inspect.grown .insp-zone, #inspect.grown .insp-wake { pointer-events: none; }

  /* AWAY — nothing at all; approach condenses a swell of light inward and the
     island materialises out of it */
  .insp-glow {
    position: absolute; left: 0; right: 0; bottom: 0; height: 132px; z-index: 40; pointer-events: none;
    background: radial-gradient(125% 108% at 50% 132%,
      rgba(var(--glow-rgb),.085) 0%, rgba(var(--glow-rgb),.052) 32%,
      rgba(var(--glow-rgb),.018) 56%, rgba(var(--glow-rgb),0) 76%);
    opacity: 0; transform: scaleX(1); transform-origin: bottom center;
    transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-snap) var(--ease-out);
  }
  #inspect.gathered .insp-glow { opacity: .55; transform: scaleX(.62) scaleY(.9); }
  #inspect.grown    .insp-glow { opacity: 0;   transform: scaleX(.66) scaleY(.8); }

  /* the island */
  .insp-glass {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 45;
    width: 772px; max-width: calc(100vw - 32px);
    display: flex; flex-direction: column; border-radius: var(--radius-xl);
    transition: width var(--dur-snap) var(--ease-out);
  }
  #inspect.grown .insp-glass { width: 868px; }
  .insp-glass::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(22px) saturate(1.2); backdrop-filter: blur(22px) saturate(1.2);
    border: 1px solid var(--border-default); box-shadow: var(--shadow-pop);
    opacity: 0; transform: scaleY(.86); transform-origin: bottom center;
    transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-snap) var(--ease-out), background var(--dur-base) var(--ease-out);
    pointer-events: none;
  }
  #inspect.gathered .insp-glass::before { opacity: 1; transform: scaleY(1); }
  #inspect.grown .insp-glass::before { opacity: 1; transform: scaleY(1); background: var(--glass-bg-solid); }

  /* the unfolding Input host — same object, taller */
  .insp-grow { position: relative; height: 0; opacity: 0; overflow: hidden; transition: height var(--dur-snap) var(--ease-out), opacity var(--dur-base) var(--ease-out); }
  #inspect.grown .insp-grow { height: auto; opacity: 1; overflow: visible; transition: opacity var(--dur-base) var(--ease-out) 90ms; }

  /* the bar: ladder pinned left, icons dead centre, Pick + close at the right */
  .insp-bar { position: relative; display: flex; align-items: center; padding: 8px 10px 8px 14px; border-top: 1px solid transparent; min-height: 48px; transition: border-color var(--dur-base) var(--ease-out); }
  #inspect.grown .insp-bar { padding: 12px 12px 12px 16px; border-top-color: var(--border-subtle); }
  .insp-acts { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); display: flex; align-items: center; gap: 2px; }
  .insp-pick { margin-left: auto; }

  /* the ladder cluster: scrub the rungs, hover to preview, or press − / + */
  .insp-ladder-wrap { display: flex; align-items: center; gap: 8px; flex: none; border-radius: var(--radius-full); transition: opacity var(--dur-base) var(--ease-out); }
  .insp-ladder-wrap.dim { opacity: .3; pointer-events: none; }
  .insp-ladder { display: flex; align-items: flex-end; gap: 2px; padding: 6px 4px; border-radius: var(--radius-sm); cursor: ew-resize; position: relative; touch-action: none; }
  .insp-ladder i { display: block; width: 1.5px; height: 7px; border-radius: 1px; background: var(--rung-off); transition: background var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  .insp-ladder i:nth-child(n+5) { height: 8px; }
  .insp-ladder i:nth-child(n+9) { height: 9px; }
  .insp-ladder i.lit { background: var(--c); }
  .insp-ladder i.pre { background: var(--c); opacity: .45; }
  .insp-ladder i.dropping { opacity: .45; }
  .insp-ladder:hover i { transform: translateY(-.5px); }
  .insp-ladder-n { font-size: 11px; font-weight: var(--weight-semibold); color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .insp-ladder-n .u { font-weight: var(--weight-medium); color: var(--text-tertiary); font-size: .85em; }

  .insp-pick svg { width: 13px; height: 13px; }

  /* aspect popover, anchored to its mark */
  .insp-anchor { position: relative; }
  .insp-pop {
    position: absolute; bottom: calc(100% + 10px); left: 50%;
    transform: translateX(-50%) translateY(6px) scale(.96); transform-origin: bottom center;
    background: var(--glass-bg-solid);

    border: 1px solid var(--border-default); border-radius: var(--radius-full); box-shadow: var(--shadow-pop);

  }
  .insp-pop.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0) scale(1); }
  .insp-pop button { appearance: none; border: 0; background: transparent; cursor: pointer; font-family: var(--font-sans); font-size: 11.5px; font-weight: var(--weight-medium); color: var(--text-tertiary); padding: 5px 10px; border-radius: var(--radius-full); white-space: nowrap; transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out); }
  .insp-pop button:hover { color: var(--text-secondary); }
  .insp-pop button.on { background: var(--bg-muted); color: var(--text-primary); box-shadow: var(--shadow-sm); }

  /* Away has no glyphs at all — the bar's contents rise into being on approach */
  #inspect:not(.gathered):not(.grown) .insp-bar { pointer-events: none; }
  .insp-bar .insp-ico, .insp-pick, .insp-ladder-wrap { transform: translateY(0); transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), opacity var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out), transform var(--dur-snap) var(--ease-out); }
  #inspect:not(.gathered):not(.grown) .insp-bar .insp-ico,
  #inspect:not(.gathered):not(.grown) .insp-pick,

  #inspect.gathered .insp-hints, #inspect.grown .insp-hints { opacity: .75; }
  .insp-hints span { display: flex; align-items: center; gap: 5px; }
  .insp-hints kbd { font: inherit; font-size: 10px; background: var(--bg-muted); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 1px 5px; color: var(--text-secondary); }

  <script>
/* ---------- constants ---------- */
var NODE_W = 300, NODE_H = 215;
/* which project session + task this board shows: /b/<session>?task=<slug> */
var SESSION = (location.pathname.match(/^\/b\/([A-Za-z0-9_-]+)/) || [null, 'demo'])[1];
var API = '/api/s/' + SESSION;
var TASK = new URLSearchParams(location.search).get('task');
var TASKS = [];
var fleetLive = false;
var POS_KEY = 'composer-pos'; // rescoped per session+task on boot
var REJ_KEY = 'composer-rejected'; // rescoped per session+task on boot
var rejected = new Set();

/* ---------- state ---------- */
/* selected is an ordered list — shift+click grows it; a plain click collapses
   it back to one. The last id is the anchor (composer placement, keyboard nav). */
var state = { nodes: [], ghosts: [], camera: { x: 0, y: 0, scale: 0.8 }, selected: [], winner: null, inspectId: null };
var cam = state.camera;
var nodeEls = {};   // real + ghost elements, keyed by node id
var drag = null;
var cmpCount = 3;
var CMP_MIN = 1, CMP_MAX = 12;
var currentAspect = '16:9';
var inspIframe = null, insPausedState = false;
var didFit = false;
var savedPos = {}; // loaded on boot once the task is known
var reqLog = [];   // last requests.jsonl view from the server, newest first

/* ---------- dom refs ---------- */
var canvas = document.getElementById('canvas');
var world  = document.getElementById('world');
var edgesSvg = document.getElementById('edges');
var composer = document.getElementById('composer');
var cmpModeEl = document.getElementById('cmpMode');
var cmpInput = document.getElementById('cmpInput');
var cmpField = document.getElementById('cmpField');
var cmpMirror = document.getElementById('cmpMirror');
var cmpInline = document.getElementById('cmpInline');
var cmpGo = document.getElementById('cmpGo');
var cmpN = document.getElementById('cmpN');
var cmpMinus = document.getElementById('cmpMinus');
var cmpPlus = document.getElementById('cmpPlus');
var cmpCountEl = document.getElementById('cmpCount');
var cmpOdo = document.getElementById('odo');
var cmpLadder = document.getElementById('ladder');
var cmpNote = document.getElementById('cmpNote');
var cmpImgs = document.getElementById('cmpImgs');
var mini = document.getElementById('minimap');
var inspect = document.getElementById('inspect');
var ispFrame = document.getElementById('ispFrame');
var ispStage = document.getElementById('ispStage');
var inspPaused = document.getElementById('ispPaused');
var ispAspect = document.getElementById('ispAspect');
var ispAspectBtn = document.getElementById('ispAspectBtn');
var ispPause = document.getElementById('ispPause');
var ispRestart = document.getElementById('ispRestart');
var ispPick = document.getElementById('ispPick');
var ispPickLabel = document.getElementById('ispPickLabel');
var ispPickCheck = document.getElementById('ispPickCheck');
var ispClose = document.getElementById('ispClose');
var ispPrev = document.getElementById('ispPrev');
var ispNext = document.getElementById('ispNext');
var ispGlass = document.getElementById('ispGlass');
var ispGrow = document.getElementById('ispGrow');
var ispLadder = document.getElementById('ispLadder');
var ispLadderN = document.getElementById('ispLadderN');
var ispLadderWrap = document.getElementById('ispLadderWrap');
var toastEl = document.getElementById('toast');

/* ---------- helpers ---------- */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function allNodes() { return state.nodes.concat(state.ghosts); }
function byId(id) { var a = allNodes(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
function isSelected(id) { return state.selected.indexOf(id) >= 0; }
function selNodes() {
  return state.selected.map(byId).filter(function (n) { return n && !n.building; });
}
function selPrimary() {
  var s = selNodes();
  return s.length ? s[s.length - 1] : null;
}
function screenToWorld(sx, sy) { return { x: (sx - cam.x) / cam.scale, y: (sy - cam.y) / cam.scale }; }
function modelColor(m) {
  if (/opus/.test(m)) return '#e0aa5a';
  if (/sonnet/.test(m)) return '#7c9cff';
  if (/haiku/.test(m)) return '#5ee08a';
  if (/fable/.test(m)) return '#c07cff';
  return '#8a9099';
}
function savePositions() {
  var out = {};
  state.nodes.forEach(function (n) { out[n.id] = { x: Math.round(n.x), y: Math.round(n.y) }; });
  try { localStorage.setItem(POS_KEY, JSON.stringify(out)); } catch (e) {}
}
var toastTimer;
function toast(msg) {
  trace('toast', { msg: msg });
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3200);
}

/* ---------- tracing ----------
   Every interaction lands in the task's trace.jsonl on the server, so a
   session can be reconstructed start to finish when something goes wrong.
   Events buffer here and flush in batches; pagehide flushes via sendBeacon
   so the tail of a session isn't lost when the tab closes. */
var traceBuf = [], traceTimer = null, traceSeq = 0;
var TRACE_ID = Math.random().toString(36).slice(2, 8); // one board load = one id
function trace(ev, data) {
  var e = { pg: TRACE_ID, seq: ++traceSeq, t: new Date().toISOString(), ev: ev };
  if (data) for (var k in data) if (data[k] !== undefined) e[k] = data[k];
  traceBuf.push(e);
  if (traceBuf.length >= 40) traceFlush();
  else if (!traceTimer) traceTimer = setTimeout(traceFlush, 2000);
}
function traceFlush(useBeacon) {
  clearTimeout(traceTimer);
  traceTimer = null;
  if (!traceBuf.length || !TASK) return;
  var payload = JSON.stringify({ events: traceBuf.splice(0) });
  var url = API + '/t/' + TASK + '/trace';
  if (useBeacon && navigator.sendBeacon) {
    navigator.sendBeacon(url, new Blob([payload], { type: 'application/json' }));
  } else {
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true })
      .catch(function () {});
  }
}
window.addEventListener('pagehide', function () { trace('pagehide'); traceFlush(true); });
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') traceFlush(true);
});
/* a click's target, said in board words: the element chain, which card it
   was on, and where it hit — both on screen and on the board */
function traceTarget(el) {
  var parts = [];
  for (var e = el, i = 0; e && e !== document.body && i < 4; e = e.parentElement, i++) {
    var s = e.tagName.toLowerCase();
    if (e.id) s += '#' + e.id;
    else if (typeof e.className === 'string' && e.className.trim())
      s += '.' + e.className.trim().split(/\s+/).slice(0, 2).join('.');
    parts.push(s);
  }
  var out = { el: parts.join(' < ') };
  var card = el.closest ? el.closest('.node') : null;
  if (card) for (var id in nodeEls) if (nodeEls[id] === card) { out.node = id; break; }
  var txt = (el.textContent || '').trim();
  if (txt && !el.children.length) out.text = txt.slice(0, 40);
  return out;
}
document.addEventListener('click', function (e) {
  var d = traceTarget(e.target);
  d.x = e.clientX; d.y = e.clientY;
  var w = screenToWorld(e.clientX, e.clientY);
  d.wx = Math.round(w.x); d.wy = Math.round(w.y);
  if (e.shiftKey) d.shift = true;
  trace('click', d);
}, true);
document.addEventListener('dblclick', function (e) {
  trace('dblclick', traceTarget(e.target));
}, true);
window.addEventListener('error', function (e) {
  trace('error', { msg: String(e.message).slice(0, 300), src: e.filename, line: e.lineno, col: e.colno });
  traceFlush();
});
window.addEventListener('unhandledrejection', function (e) {
  trace('error', { msg: ('unhandled rejection: ' + (e.reason && (e.reason.message || e.reason))).slice(0, 300) });
  traceFlush();
});
/* the camera settles often (pan, zoom, tweens) — log where it comes to rest */
var traceCamTimer = null, traceCamLast = '';
function traceCamera() {
  clearTimeout(traceCamTimer);
  traceCamTimer = setTimeout(function () {
    var s = Math.round(cam.x) + ',' + Math.round(cam.y) + ',' + cam.scale.toFixed(2);
    if (s === traceCamLast) return;
    traceCamLast = s;
    trace('camera', { x: Math.round(cam.x), y: Math.round(cam.y), scale: +cam.scale.toFixed(3) });
  }, 500);

  if (inspecting && p && p.id !== state.inspectId) openInspect(p.id);
}

/* ---------- server sync ---------- */
function refreshVariants(announce) {
  return fetch(API + '/t/' + TASK + '/variants').then(function (r) { return r.json(); }).then(function (list) {
    // one node per variant file — a tweak lands as a child card like any other
    var seen = {};
    var added = 0;
    var rootIdx = state.nodes.filter(function (n) { return n.parentId == null; }).length;
    list.forEach(function (v) {
      seen[v.id] = true;
      var parentId = v.parent || null;
      // a combine lists every parent it was mixed from; the extras keep their
      // ghostly strands once the real card lands where the ghost stood
      var extra = [];
      (v.parents || []).forEach(function (f) {
        if (f !== parentId && f !== v.id && extra.indexOf(f) < 0) extra.push(f);
      });
      var existing = byId(v.id);
      if (existing) {
        existing.parentId = parentId;
        if (extra.length) existing.extraParents = extra;
        return;
      }
      var pos = savedPos[v.id], how = 'saved';
      if (!pos) {
        var parent = parentId ? byId(parentId) : null;
        if (parent) {
          pos = adoptGhostSlot(parent.id);
          how = pos ? 'ghost-slot' : 'placed';
          if (!pos) pos = placeArrival(parent, Date.parse(v.ts) || 0);
        } else {
          pos = placeRoot(rootIdx++);
          how = 'root';
        }
      }
      trace('variant:landed', {
        id: v.id, name: v.name, model: v.model, parent: parentId,
        x: Math.round(pos.x), y: Math.round(pos.y), how: how
      });
      var n = {
        id: v.id, parentId: parentId, ts: v.ts,
        extraParents: extra.length ? extra : (pos.extraParents || []),
        name: v.name, model: v.model, description: v.description, html: v.html, url: v.url,
        x: pos.x, y: pos.y, building: false
      };
      state.nodes.push(n);
      createNodeEl(n);
      added++;
    });
    state.nodes = state.nodes.filter(function (n) {
      if (seen[n.id]) return true;
      trace('variant:removed', { id: n.id });
      removeNodeEl(n.id);
      var si = state.selected.indexOf(n.id);
      if (si >= 0) { state.selected.splice(si, 1); syncComposer(); }
      return false;
    });
    renderEdges();
    renderMinimap();
    if (added > 0) traceLayout('landed');
    if (!didFit && state.nodes.length) { didFit = true; fitView(); }
    if (announce && added > 0) toast(added + ' new variant' + (added > 1 ? 's' : '') + ' arrived ✨');
  });
}

// failed requests toast once each — but never for failures that predate
// this page load (reqsPrimed gates the first refresh)
var failedSeen = {}, reqsPrimed = false;

function refreshRequests() {
  return fetch(API + '/t/' + TASK + '/requests').then(function (r) { return r.json(); }).then(function (reqs) {
    reqLog = reqs;
    reqs.forEach(function (rq) {
      if (rq.status !== 'failed' || failedSeen[rq.id]) return;
      failedSeen[rq.id] = true;
      trace('request:failed', { id: rq.id, note: rq.note });
      if (reqsPrimed) toast('Generation failed' + (rq.note ? ' — ' + rq.note : ''));
    });
    reqsPrimed = true;
    // the winner is server-side state: the newest non-cancelled pick request
    var w = null;
    for (var i = 0; i < reqs.length; i++) {
      if (reqs[i].type === 'pick' && reqs[i].status !== 'cancelled' && reqs[i].variants && reqs[i].variants[0]) { w = reqs[i].variants[0]; break; }
    }
    if (w !== state.winner) {
      trace('winner', { id: w });
      state.winner = w;
      allNodes().forEach(updateNodeVisual);
      if (state.inspectId) ispPaintPick();
    }
    // ghost nodes for the slots of open iterate requests still being built
    var wanted = {};
    iterateSlots().forEach(function (s) {
      var rq = s.req;
      if (rq.status === 'done' || rq.status === 'cancelled' || rq.status === 'failed') return;
      var parent = byId(s.parentId);
      if (!parent || parent.building) return;
      for (var i = s.filled; i < rq.count; i++) {
        var gid = 'ghost:' + rq.id + ':' + i;
        wanted[gid] = true;
        if (byId(gid)) continue;
        var pos = placeChild(parent, i, rq.count);
        var g = {
          id: gid, name: 'building…', model: 'fleet', description: '',
          parentId: parent.id,
          extraParents: rq.variants.slice(1),
          html: '', x: pos.x, y: pos.y, building: true, reqText: rq.text, reqId: rq.id
        };
        trace('ghost:opened', { id: gid, req: rq.id, parent: parent.id, x: Math.round(pos.x), y: Math.round(pos.y) });
        state.ghosts.push(g);
        createNodeEl(g);
      }
    });
    state.ghosts = state.ghosts.filter(function (g) {
      if (wanted[g.id]) return true;
      trace('ghost:closed', { id: g.id });
      removeNodeEl(g.id);
      return false;
    });
    renderEdges();
    renderMinimap();
  });
}

function cancelRequest(reqId) {
  trace('request:cancel', { id: reqId });
  // allowed even when the fleet is offline — it only retracts work
  fetch(API + '/t/' + TASK + '/requests/' + reqId + '/cancel', { method: 'POST' }).then(function (r) {
    if (r.ok) toast('Generation cancelled');
    refreshRequests();
  });
}

function sendRequest(text, variantIds, count, type, images) {
  var body = { text: text, variants: variantIds };
  // which model the fleet should build with — iterate and tweak both carry it
  if (type === 'iterate' || type === 'tweak') body.model = cmpModel().id;
  if (count) body.count = count;
  if (type) body.type = type;
  if (images && images.length) body.images = images;
  // what was asked for, verbatim — then whether the server took it
  trace('request:send', {
    type: type || 'feedback', text: text, variants: variantIds,
    count: count || undefined, model: body.model, images: body.images
  });
  return fetch(API + '/t/' + TASK + '/requests', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().then(function (d) {
      trace(r.ok ? 'request:ack' : 'request:fail', { id: d.id, error: d.error, http: r.status });
      return r;
    }).catch(function () { trace('request:fail', { http: r.status }); return r; });
  }, function (err) {
    trace('request:fail', { msg: String(err).slice(0, 200) });
    throw err;
  });
}

/* ---------- iterate (core) ---------- */
function doIterate() {
  var parents = selNodes();
  if (!parents.length) return;
  if (!fleetLive) { cmpShowNote('Fleet offline — run /composer to reconnect.'); return; }
  if (!cmpImagesReady()) { cmpShowNote('Still uploading an image…', 2600); return; }
  var req = cmpInput.value.trim();
  var imgs = cmpImages.map(function (i) { return i.file; });
  var names = parents.map(function (p) { return '"' + p.name + '"'; }).join(' + ');
  var text = 'Iterate ' + cmpCount + ' new variant' + (cmpCount > 1 ? 's' : '') +
    (parents.length > 1 ? ' combining ' + names : ' from ' + names) + (req ? ' — ' + req : '') +
    (imgs.length ? ' (see the ' + (imgs.length > 1 ? imgs.length + ' attached reference images' : 'attached reference image') + ')' : '');
  var ids = parents.map(function (p) { return p.id; });
  sendRequest(text, ids, cmpCount, 'iterate', imgs).then(function () {
    cmpInput.value = '';
    cmpClearImages();
    cmpLayout(true);   // collapse straight back to the bare chip
    cmpShowNote('<i class="dot"></i>Sent · ' + cmpCount + ' variant' + (cmpCount > 1 ? 's' : ''), 3800);
    refreshRequests();
  });
}

/* ---------- tweak (one small change, lands as a child card) ---------- */
function doTweak() {
  var n = selPrimary();
  if (!n) return;
  if (!fleetLive) { cmpShowNote('Fleet offline — run /composer to reconnect.'); return; }
  var req = cmpInput.value.trim();
  if (!req) { cmpShowNote('Describe the tweak first.', 2600); return; }
  // count:1 so the board draws a ghost child slot for it, like an iterate
  sendRequest('Tweak "' + n.name + '" — ' + req, [n.id], 1, 'tweak').then(function () {
    cmpInput.value = '';
    cmpLayout(true);
    cmpShowNote('<i class="dot"></i>Sent · tweak', 3800);
    refreshRequests();
  });
}
function doSend() {
  // a rejected card is a dead end — nothing regenerates from it
  var p = selPrimary();
  if (p && isRejected(p.id)) { cmpShowNote('Rejected — rescue it to iterate.', 2600); return; }
  if (cmpModeType === 'tweak') doTweak(); else doIterate();
}

/* the Reject segment mirrors the anchor selection; Iterate locks against it */
var cmpReject = document.getElementById('cmpReject');
function refreshRejectBtn() {
  var sel = selNodes();
  var one = sel.length === 1 && !sel[0].building ? sel[0] : null;
  composer.classList.toggle('show-reject', !!one);
  if (one) {
    var r = isRejected(one.id);
    cmpReject.classList.toggle('is-rejected', r);

    cmpReject.title = r ? 'Rescue this variant' : 'Reject this variant';
  }
}

  }
}
cmpReject.addEventListener('click', function (e) {

});

/* ---------- inspect ----------
   Three states of one glass object: Away (nothing drawn but the framed
   variant), Gathered (the island bar + edge chevrons wake on approach) and
   Grown (the Input docks into the island). The state lives as classes on
   #inspect itself. */
function ispState() {
  return inspect.classList.contains('grown') ? 'grown'
    : inspect.classList.contains('gathered') ? 'gathered' : 'away';
}
var ispScatterT = null;

  clearTimeout(ispScatterT);
  if (!inspect.classList.contains('gathered')) trace('inspect:gather');
  inspect.classList.add('gathered');
}

  if (inspect.classList.contains('grown') || ispScrub) return;
  clearTimeout(ispScatterT);
  ispScatterT = setTimeout(function () {
    if (!inspect.classList.contains('grown') && !ispAspect.classList.contains('open') && !ispScrub) {
      inspect.classList.remove('gathered');
    }
  }, 500);
}

function ispPaintPick() {
  if (state.inspectId == null) return;
  var won = winnerNodeId() === state.inspectId;
  ispPickLabel.textContent = won ? 'Winner' : 'Pick this one';
  ispPickCheck.style.display = won ? 'block' : 'none';
  ispPick.classList.toggle('won', won);
}
/* the edge zones walk the same sibling list as ←/→; the ends are walls */

  var n = byId(state.inspectId);
  if (!n) return;
  var sibs = navSiblingsOf(n), i = sibs.indexOf(n);
  ispPrev.disabled = i <= 0;
  ispNext.disabled = i < 0 || i >= sibs.length - 1;
}

function openInspect(id) {
  var n = byId(id);
  if (!n) return;
  trace('inspect:open', { id: id });
  var prev = (!inspect.hidden && state.inspectId != null && state.inspectId !== id) ? byId(state.inspectId) : null;
  state.inspectId = id;
  inspect.hidden = false;
  ispPaintPick();
  ispPaintNav();
  buildInspFrame(n);
  setAspect(currentAspect);
  /* the slide-and-fade that sells a variant change */
  if (prev) {
    ispFrame.classList.add(n.x >= prev.x ? 'slip-right' : 'slip-left');
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      ispFrame.classList.remove('slip-left', 'slip-right');
    }); });
  }
}
function buildInspFrame(n) {
  ispFrame.innerHTML = '';
  var f = document.createElement('iframe');
  if (n.url) {
    // live route on the project's dev server — can't inject the pause hook
    f.setAttribute('sandbox', 'allow-scripts allow-same-origin');
    f.src = n.url;
    ispPause.disabled = true;
  } else {
    f.setAttribute('sandbox', 'allow-scripts');
    f.srcdoc = withPause(n.html);
    ispPause.disabled = false;
  }
  ispFrame.appendChild(f);
  inspIframe = f;
  insPausedState = false;
  ispRenderPause();
}
/* the frame is CSS-sized off its aspect ratio — setting it is two custom props */
function setAspect(a) {
  if (a !== currentAspect) trace('inspect:aspect', { aspect: a });
  currentAspect = a;
  var kids = ispAspect.children;
  for (var i = 0; i < kids.length; i++) kids[i].classList.toggle('on', kids[i].getAttribute('data-a') === a);
  var parts = a.split(':'), wr = +parts[0], hr = +parts[1];

}
function ispSetPopOpen(v) {
  ispAspect.classList.toggle('open', !!v);
  ispAspectBtn.classList.toggle('on', !!v);
}
function closeInspect() {
  if (state.inspectId != null) trace('inspect:close', { id: state.inspectId });
  closeInspectIterate();
  ispSetPopOpen(false);
  clearTimeout(ispScatterT);
  inspect.classList.remove('gathered');
  inspect.hidden = true;
  state.inspectId = null;
  ispFrame.innerHTML = '';
  inspIframe = null;
}
/* the Input docks INTO the island: the same glass object grows a composer */
function openInspectIterate() {
  if (state.inspectId == null) return;
  select(state.inspectId); // docked iterate is about the inspected variant only
  composer.classList.add('in-inspect');
  ispGrow.appendChild(composer);
  inspect.classList.add('grown');
  ispGather();
  cmpLayout(true);   // docked, the resting field is wider — re-decide the state
  syncComposer();
  cmpInput.focus();
}
function closeInspectIterate() {
  inspect.classList.remove('grown');
  if (composer.parentNode === ispGrow) document.body.insertBefore(composer, inspect);
  composer.classList.remove('in-inspect');
  cmpLayout(true);
  syncComposer();
  ispScatterSoon();
}
/* Esc peels one layer at a time: iterate panel, then overlay, then selection */
function escAction() {
  // fullscreen is the outermost layer — the browser exits it on Esc; don't also peel the overlay
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  // the model card is the shallowest thing open — Esc folds it before anything else
  if (composer.classList.contains('dialopen')) { cmpSetDialOpen(false); return; }
  if (ispAspect.classList.contains('open')) { ispSetPopOpen(false); return; }
  if (composer.classList.contains('in-inspect')) closeInspectIterate();
  else if (state.inspectId != null) closeInspect();
  else select(null);
}
/* fullscreen the frame wrapper (not the iframe) so Restart keeps working inside it */
function toggleFullscreen() {
  var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  trace('inspect:fullscreen', { on: !fsEl, id: state.inspectId });
  if (fsEl) {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  } else if (state.inspectId != null) {
    if (ispFrame.requestFullscreen) ispFrame.requestFullscreen();
    else if (ispFrame.webkitRequestFullscreen) ispFrame.webkitRequestFullscreen();
  }
}
function ispRenderPause() {
  inspPaused.hidden = !insPausedState;
  ispPause.classList.toggle('on', insPausedState);
  ispPause.title = insPausedState ? 'Play' : 'Pause';
  ispPause.querySelector('svg').innerHTML = insPausedState
    ? '<path d="M7 4.5v15l13-7.5z"/>'
    : '<path d="M9 5v14M15 5v14"/>';
}
function togglePause() {
  if (!inspIframe) return;
  trace('inspect:' + (insPausedState ? 'play' : 'pause'), { id: state.inspectId });
  inspIframe.contentWindow.postMessage(insPausedState ? 'play' : 'pause', '*');
  insPausedState = !insPausedState;
  ispRenderPause();
}
function setWinner(id) {
  if (!fleetLive) { toast('Fleet offline — run /composer in the project to reconnect'); return; }
  var n = byId(id);
  if (!n) return;
  var file = n.id;
  state.winner = file; // optimistic; server truth arrives via refreshRequests
  allNodes().forEach(updateNodeVisual);
  renderMinimap();
  if (state.inspectId) ispPaintPick();
  sendRequest('Pick "' + n.name + '" — implement this design.', [file], null, 'pick').then(refreshRequests);
}

/* ---------- minimap ---------- */
function renderMinimap() {
  var ctx = mini.getContext('2d');
  var W = mini.width, H = mini.height;
  ctx.clearRect(0, 0, W, H);
  var a = allNodes();
  if (!a.length) return;
  var minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  a.forEach(function (n) {
    minx = Math.min(minx, n.x); miny = Math.min(miny, n.y);
    maxx = Math.max(maxx, n.x + NODE_W); maxy = Math.max(maxy, n.y + NODE_H);
  });
  var v0 = screenToWorld(0, 0), v1 = screenToWorld(window.innerWidth, window.innerHeight);
  minx = Math.min(minx, v0.x); miny = Math.min(miny, v0.y);
  maxx = Math.max(maxx, v1.x); maxy = Math.max(maxy, v1.y);
  var bw = maxx - minx, bh = maxy - miny, pad = 8;
  var s = Math.min((W - pad * 2) / bw, (H - pad * 2) / bh);
  var ox = pad - minx * s + (W - pad * 2 - bw * s) / 2;
  var oy = pad - miny * s + (H - pad * 2 - bh * s) / 2;
  a.forEach(function (n) {
    ctx.fillStyle = n.id === winnerNodeId() ? '#f5f5f5' : (n.building ? '#525252' : '#a3a3a3');
    ctx.fillRect(ox + n.x * s, oy + n.y * s, Math.max(2, NODE_W * s), Math.max(2, NODE_H * s));
  });
  ctx.strokeStyle = 'rgba(245,245,245,.7)';
  ctx.lineWidth = 1;
  ctx.strokeRect(ox + v0.x * s, oy + v0.y * s, (v1.x - v0.x) * s, (v1.y - v0.y) * s);
}

/* ---------- global pointer handlers ---------- */
canvas.addEventListener('mousedown', function (e) {
  if (e.button !== 0) return;
  drag = { mode: 'pan', lastX: e.clientX, lastY: e.clientY, moved: 0 };
});
/* a hand on the board wins: the organize tween lands where it was headed
   rather than fighting the pan, the drag or the zoom */
window.addEventListener('mousedown', organizeSettle, true);
window.addEventListener('mousemove', function (e) {
  if (!drag) return;
  var dx = e.clientX - drag.lastX, dy = e.clientY - drag.lastY;
  drag.lastX = e.clientX; drag.lastY = e.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.mode === 'pan') {
    cam.x += dx; cam.y += dy; applyCamera();
  } else {
    var n = byId(drag.id);
    if (n) { n.x += dx / cam.scale; n.y += dy / cam.scale; updateNodePos(n); renderEdges(); syncComposer(); renderMinimap(); }
  }
});
window.addEventListener('mouseup', function (e) {
  if (drag && drag.mode === 'pan' && drag.moved < 4) select(null);
  if (drag && drag.mode === 'node') {
    // a plain still click on a member of a multi-selection collapses to it
    var n = byId(drag.id);
    if (drag.moved < 4 && !e.shiftKey && n && !n.building) select(drag.id);
    // a real drag: the card moved — log where it left and where it landed
    if (drag.moved >= 4 && n) {
      trace('node:moved', {
        id: drag.id,
        from: { x: Math.round(drag.fromX), y: Math.round(drag.fromY) },
        to: { x: Math.round(n.x), y: Math.round(n.y) }
      });
      traceLayout('drag');
    }
    savePositions();
  }
  drag = null;
});
canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  organizeSettle();
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  var wx = (mx - cam.x) / cam.scale, wy = (my - cam.y) / cam.scale;
  var factor = Math.exp(-e.deltaY * 0.0015);
  cam.scale = clamp(cam.scale * factor, 0.15, 2.5);
  cam.x = mx - wx * cam.scale;
  cam.y = my - wy * cam.scale;
  applyCamera();
}, { passive: false });

/* ---------- ui wiring ---------- */
document.getElementById('tbZoomOut').addEventListener('click', function () { zoomBy(1 / 1.2); });
document.getElementById('tbZoomIn').addEventListener('click', function () { zoomBy(1.2); });
document.getElementById('tbFit').addEventListener('click', fitView);
document.getElementById('tbOrg').addEventListener('click', organizeView);

/* subtle light/dark toggle — canvas defaults to dark; only flips CSS tokens */
(function () {
  var tt = document.getElementById('themeToggle');
  function sync() { tt.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '☀' : '☾'; }
  sync();
  tt.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);

})();

/* ---------- the composer's two states ----------
   Resting is a one-line chip; composing is a textarea. There is no continuum
   between them: the moment the caret would run out of room the panel and field
   snap open together in one motion, and the hints arrive with it. Coming back
   needs both a quiet spell and a margin of slack, so it can't flap. */
var CMP_REST_H = 32, CMP_COMP_H = 108, CMP_COMP_H_MAX = 150;
var CMP_RETURN_DELAY = 400;   // ms of no typing before collapsing back
var CMP_HYSTERESIS = 14;      // px of slack required before returning
var CMP_CARET_SLACK = 8;      // the caret needs room too — snap just before it clips
var cmpMode = 'resting';
var cmpReturnTimer = null, cmpRemeasure = null, cmpSettle = null;

function cmpDocked() { return composer.classList.contains('in-inspect'); }
function cmpPanelWidth(mode) {
  if (cmpDocked()) return mode === 'composing' ? 520 : 320;
  return mode === 'composing' ? 412 : 292;
}
/* Usable text width of the RESTING field, derived rather than measured: while
   composing, the live panel is already wide, so there is nothing to measure.
   panel borders 2 + panel padding 24 + field borders 2 + field padding 20 */
function cmpRestingTextWidth() { return cmpPanelWidth('resting') - 48; }

var cmpMeas = document.createElement('span');
cmpMeas.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0;';
document.body.appendChild(cmpMeas);
function cmpTextWidth(s) {
  var cs = getComputedStyle(cmpInput);
  cmpMeas.style.font = cs.font;
  cmpMeas.style.letterSpacing = cs.letterSpacing;
  cmpMeas.textContent = s;
  return cmpMeas.getBoundingClientRect().width;
}

function cmpWantsComposing(v) {
  if (v.indexOf('\n') >= 0) return true;                 // an explicit newline needs the box
  return cmpTextWidth(v) + CMP_CARET_SLACK > cmpRestingTextWidth();
}
function cmpFitsResting(v) {
  if (v.indexOf('\n') >= 0) return false;
  return cmpTextWidth(v) + CMP_CARET_SLACK + CMP_HYSTERESIS <= cmpRestingTextWidth();
}

function cmpSetMode(next, immediate) {
  if (cmpMode === next) return;
  cmpMode = next;
  composer.classList.toggle('composing', next === 'composing');
  composer.classList.remove('settled');
  clearTimeout(cmpSettle);
  if (next === 'composing' && !immediate) {
