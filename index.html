<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Composer</title>
<style>
  /* Geist — nearest neutral grotesque for the Monochrome kit */
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

  /* ===== Monochrome design-system tokens (imported from claude.ai/design) ===== */
  :root {
    /* Neutral ramp — the whole system lives on this */
    --gray-0:#ffffff; --gray-50:#fafafa; --gray-100:#f5f5f5; --gray-150:#ededed;
    --gray-200:#e5e5e5; --gray-300:#d4d4d4; --gray-400:#a3a3a3; --gray-500:#737373;
    --gray-600:#525252; --gray-700:#404040; --gray-800:#262626; --gray-900:#171717; --gray-950:#0a0a0a;
    /* Surfaces */
    --bg-page:var(--gray-0); --bg-subtle:var(--gray-50); --bg-muted:var(--gray-100);
    --bg-surface:var(--gray-0); --bg-inverse:var(--gray-900); --bg-overlay:rgba(10,10,10,.4);
    /* Text */
    --text-primary:var(--gray-900); --text-secondary:var(--gray-500); --text-tertiary:var(--gray-400); --text-inverse:var(--gray-0);
    /* Borders */
    --border-default:var(--gray-200); --border-strong:var(--gray-300); --border-subtle:var(--gray-150);
    /* Accent — ink; the brand color is the absence of color */
    --accent:var(--gray-900); --accent-hover:var(--gray-800); --accent-fg:var(--gray-0);
    /* Theme-tuned extras */
    --ring:rgba(23,23,23,.30); --dot:rgba(10,10,10,.06);
    --edge:rgba(115,115,115,.55); --edge-ghost:rgba(115,115,115,.30);
    --input-glow:var(--gray-150); --pill-active:var(--bg-surface);
    /* Radii */
    --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:20px; --radius-full:999px;
    /* Shadows — whispers */
    --shadow-sm:0 1px 3px rgba(10,10,10,.06),0 1px 2px rgba(10,10,10,.04);
    --shadow-md:0 4px 12px rgba(10,10,10,.08);
    --shadow-lg:0 12px 32px rgba(10,10,10,.12);
    --shadow-pop:0 24px 48px -12px rgba(10,10,10,.18);
    /* Motion */
    --ease-out:cubic-bezier(.16,1,.3,1); --dur-fast:120ms; --dur-base:200ms; --dur-snap:290ms;
    /* Type */
    --font-sans:'Geist',ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:'Geist Mono','SF Mono','Menlo',monospace;
    --weight-medium:500; --weight-semibold:600; --weight-bold:700;
    --tracking-normal:-.01em; --tracking-heading:-.02em;
    --text-xs:12px; --text-sm:13px; --text-md:14px; --text-lg:16px;
    color-scheme:light;
  }
  [data-theme="dark"] {
    --bg-page:#0a0a0a; --bg-subtle:#141414; --bg-muted:#1f1f1f; --bg-surface:#141414;
    --bg-inverse:#fafafa; --bg-overlay:rgba(0,0,0,.6);
    --text-primary:#f5f5f5; --text-secondary:#a3a3a3; --text-tertiary:#737373; --text-inverse:#171717;
    --border-default:#262626; --border-strong:#404040; --border-subtle:#1f1f1f;
    --accent:#f5f5f5; --accent-hover:#ffffff; --accent-fg:#171717;
    --ring:rgba(245,245,245,.5); --dot:rgba(255,255,255,.05);
    --edge:rgba(163,163,163,.45); --edge-ghost:rgba(163,163,163,.26);
    --input-glow:var(--gray-800); --pill-active:var(--gray-700);
    color-scheme:dark;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-page); color: var(--text-primary); overflow: hidden;
    letter-spacing: var(--tracking-normal);
    -webkit-font-smoothing: antialiased;
    transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
  }

  /* canvas + world */
  #canvas {
    position: fixed; inset: 0; overflow: hidden;
    background-color: var(--bg-page);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 40px 40px;
    cursor: grab;
  }
  #canvas:active { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }

  #edges { position: absolute; left: 0; top: 0; width: 10px; height: 10px; overflow: visible; pointer-events: none; }
  #edges .edge { fill: none; stroke: var(--edge); stroke-width: 2; }
  #edges .edge.ghostly { stroke-dasharray: 6 6; stroke: var(--edge-ghost); }

  /* node */
  .node {
    position: absolute; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-lg);
    cursor: grab; user-select: none;
    box-shadow: var(--shadow-md);
    transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  .node:hover { border-color: var(--border-strong); }
  .node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--ring), var(--shadow-lg); }
  .node.winner { border-color: var(--accent); }
  .node.building { cursor: default; border-style: dashed; border-color: var(--border-strong); animation: pulse 1.6s ease-in-out infinite; }
  .node .preview {
    width: 300px; height: 169px; overflow: hidden; position: relative; background: var(--bg-page);
    /* overflow:hidden alone doesn't clip the composited (scaled) iframe layer,
       so its square corners paint over the card's rounded border at high zoom */
    clip-path: inset(0 round 13px 13px 0 0);
  }
  .node .scaler { width: 1200px; height: 675px; transform: scale(.25); transform-origin: top left; }
  .node iframe { width: 1200px; height: 675px; border: 0; pointer-events: none; background: #000; }
  .node .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; }
  .node .nm { font-size: 12.5px; color: var(--text-primary); font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .mdl { display: flex; align-items: center; gap: 5px; flex: none; font-size: 10.5px; color: var(--text-secondary); }
  .node .mdl i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .node .crown { position: absolute; top: 6px; left: 8px; color: var(--accent); font-size: 15px; display: none; z-index: 3; text-shadow: 0 1px 3px rgba(0,0,0,.55); }
  .node.winner .crown { display: block; }
  .node .expand {
    position: absolute; top: 6px; right: 6px; z-index: 3; width: 24px; height: 24px;
    border: 1px solid var(--border-default); border-radius: var(--radius-full); background: var(--bg-surface); color: var(--text-secondary); cursor: pointer;
    opacity: 0; transition: opacity var(--dur-fast) var(--ease-out), background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
    font-size: 12px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .node .expand:hover { background: var(--bg-subtle); border-color: var(--border-strong); color: var(--text-primary); }
  .node:hover .expand { opacity: 1; }
  .node .build {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; background: var(--bg-subtle); color: var(--text-secondary); font-size: 12px;
    border-radius: 13px;
  }
  .node.building .build { display: flex; }
  .node .build .req { max-width: 250px; text-align: center; color: var(--text-tertiary); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .build .cancel, .node .adj .cancel {
    margin-top: 2px; padding: 5px 14px; border-radius: var(--radius-full);
    border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-secondary);
    cursor: pointer; font-size: 11px; font-family: var(--font-sans); font-weight: var(--weight-medium);
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .node .build .cancel:hover, .node .adj .cancel:hover { background: var(--bg-subtle); border-color: var(--border-strong); color: var(--text-primary); }
  .node .spin { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(128,128,128,0); } 50% { box-shadow: 0 0 0 3px var(--ring); } }

  /* adjust-in-flight: the whole card re-weaves under one shimmer clock — a
     sweep across the dimmed card, the same sweep on the rail's working chip,
     and a centered layer carrying the tweak + Cancel. The current revision
     stays faintly visible underneath: an adjust edits THIS design in place. */
  .node .adj {
    position: absolute; inset: 0; z-index: 4; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    border-radius: 13px; overflow: hidden; background: var(--bg-overlay);
    color: var(--text-secondary); font-size: 12px;
  }
  .node.adjusting .adj { display: flex; }
  .node .adj .tw { max-width: 250px; text-align: center; color: var(--text-tertiary); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shimmer::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.09) 50%, transparent 60%);
    background-size: 250% 100%;
    animation: sweep 1.6s linear infinite;
  }
  @keyframes sweep { from { background-position: 200% 0; } to { background-position: -150% 0; } }

  /* revision rail: adjusts don't branch — they stack as version chips hanging
     off the node's bottom edge. Nodes with a single revision only offer the
     "+" stub, revealed on hover/selection so the canvas stays quiet. */
  .rail { position: absolute; top: 100%; left: 0; right: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; cursor: default; }
  .rail .rl { width: 8px; height: 12px; border-left: 1px solid var(--border-strong); border-right: 1px solid var(--border-strong); }
  .rail .chips { display: flex; gap: 4px; align-items: center; }
  .rail.stub { opacity: 0; pointer-events: none; transition: opacity var(--dur-fast) var(--ease-out); }
  .node:hover .rail.stub, .node.selected .rail.stub { opacity: 1; pointer-events: auto; }
  .chip {
    height: 22px; min-width: 27px; padding: 0 8px; border-radius: var(--radius-full);
    border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-secondary);
    font-size: 10.5px; font-family: var(--font-mono); font-weight: var(--weight-medium);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text-primary); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: var(--weight-semibold); }
  .chip.add { border-style: dashed; color: var(--text-tertiary); font-family: var(--font-sans); font-size: 13px; }
  .chip.add:hover { color: var(--text-primary); border-color: var(--border-strong); }
  .chip.working { position: relative; overflow: hidden; border-style: dashed; gap: 3px; }
  .chip.working i { width: 3px; height: 3px; border-radius: 50%; background: var(--text-secondary); animation: breathe 1.2s ease-in-out infinite; }
  .chip.working i:nth-child(2) { animation-delay: .2s; }
  .chip.working i:nth-child(3) { animation-delay: .4s; }
  @keyframes breathe { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  /* hud */
  #hud { position: fixed; top: 14px; left: 16px; z-index: 20; font-size: 12px; color: var(--text-secondary); pointer-events: none; display: flex; align-items: center; }
  #hud b { color: var(--text-primary); font-weight: var(--weight-semibold); }
  #hud a { color: inherit; text-decoration: none; pointer-events: auto; }
  #hud a:hover { text-decoration: underline; }
  #sessName { color: var(--text-secondary); }
  #taskSel {
    pointer-events: auto; appearance: none; -webkit-appearance: none; max-width: 320px;
    background: transparent; border: 0; border-bottom: 1px dashed var(--border-strong);
    color: var(--text-primary); font: inherit; cursor: pointer; padding: 0 2px; outline: none;
  }
  #live { color: var(--text-primary); font-weight: var(--weight-medium); }
  #live.off { color: var(--text-tertiary); }

  /* toolbar */
  #toolbar { position: fixed; left: 16px; bottom: 16px; z-index: 20; display: flex; gap: 6px; }
  #toolbar button {
    min-width: 36px; height: 36px; padding: 0 14px; border-radius: var(--radius-full); border: 1px solid var(--border-default);
    background: var(--bg-surface); color: var(--text-primary); cursor: pointer; font-size: 15px; font-family: var(--font-sans);
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  #toolbar button:hover { background: var(--bg-subtle); border-color: var(--border-strong); }
  #toolbar button:active { transform: scale(.97); }

  /* theme toggle */
  #themeToggle {
    position: fixed; top: 12px; right: 16px; z-index: 20; width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-default); border-radius: var(--radius-full);
    background: var(--bg-surface); color: var(--text-secondary); cursor: pointer; font-size: 15px;
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  #themeToggle:hover { background: var(--bg-subtle); border-color: var(--border-strong); color: var(--text-primary); }

  /* minimap — a HUD chip; kept on a fixed dark surface so its marks stay legible in both themes */
  #minimap { position: fixed; right: 16px; bottom: 16px; z-index: 20; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: rgba(10,10,10,.82); display: block; box-shadow: var(--shadow-md); }

  /* composer */
  /* Two states, one motion: a bare 230px chip at rest, a 412px textarea while
     composing. Everything explanatory (keycap hint, note row) belongs to the
     composing state or to a confirmation — the resting chip is only what you
     can operate, so its bottom edge sits right under the buttons. */
  #composer {
    position: fixed; z-index: 25; width: 230px; background: var(--bg-surface); border: 1px solid var(--border-default);
    border-radius: var(--radius-lg); padding: 12px; box-shadow: var(--shadow-pop); font-size: 12px;
    transition: width var(--dur-snap) var(--ease-out), box-shadow var(--dur-snap) var(--ease-out),
                border-color var(--dur-snap) var(--ease-out);
  }
  #composer.composing { width: 412px; border-color: var(--border-strong); }

  /* the panel opens straight onto the mode toggle — the selection ring already
     says which node this is about, so there is no title line */
  #cmpMode { display: flex; gap: 2px; padding: 3px; background: var(--bg-muted); border-radius: var(--radius-full); margin-bottom: 9px; }
  #cmpMode button {
    flex: 1; height: 26px; border-radius: var(--radius-full); border: none; background: none;
    color: var(--text-secondary); cursor: pointer; font-size: 12px; font-family: var(--font-sans); font-weight: var(--weight-medium);
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  #cmpMode button:hover:not(:disabled) { color: var(--text-primary); }
  #cmpMode button.on { background: var(--pill-active); color: var(--text-primary); box-shadow: var(--shadow-sm); font-weight: var(--weight-semibold); }
  #cmpMode button:disabled { opacity: .35; cursor: default; }

  /* Reference images (pasted / dropped) ride above the field as thumbnails.
     The row reserves no space until something is attached. */
  .cmp-imgs { display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #composer.has-imgs .cmp-imgs { display: flex; }
  .cmp-img {
    position: relative; width: 44px; height: 44px; flex: none;
    border: 1px solid var(--border-default); border-radius: var(--radius-sm);
    overflow: hidden; background: var(--bg-muted);
  }
  .cmp-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cmp-img.pending img { opacity: .35; }
  .cmp-img .up {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  }
  .cmp-img.pending .up { display: flex; }
  .cmp-img .up i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .cmp-img .rm {
    position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; padding: 0;
    border: 0; border-radius: var(--radius-full); background: var(--bg-inverse); color: var(--text-inverse);
    font-size: 9px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity var(--dur-fast) var(--ease-out);
  }
  .cmp-img:hover .rm { opacity: 1; }
  #cmpField.dropping { border-color: var(--gray-400); box-shadow: 0 0 0 3px var(--input-glow); }

  /* The wrapper owns the height transition and clips; the textarea inside snaps
     straight to its final box with no transition of its own. Animating the
     textarea itself makes the browser chase the caret and re-clamp scrollTop on
     every frame of the ease, which reads as a flicker on each new line. */
  #cmpField {
    position: relative; height: 32px; background: var(--bg-page); overflow: hidden;
    border: 1px solid var(--border-default); border-radius: var(--radius-md);
    transition: height var(--dur-snap) var(--ease-out), border-color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out), background var(--dur-base) var(--ease-out);
  }
  #composer.composing #cmpField { height: var(--cmp-fh, 108px); background: var(--bg-subtle); }
  /* growth past the snap is deliberately quieter — the snap stays the moment */
  #composer.composing.settled #cmpField { transition: height 170ms var(--ease-out), border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
  #cmpField:hover { border-color: var(--border-strong); }
  #cmpField.hot { border-color: var(--gray-400); box-shadow: 0 0 0 3px var(--input-glow); }
  #cmpInput, #cmpMirror {
    font-size: 12px; font-family: var(--font-sans); line-height: 17px; padding: 7px 10px;
    white-space: pre; overflow-wrap: normal; word-break: normal;
  }
  /* the hint floats over the bottom-right corner — reserve a gutter under the
     text so the last line never lands beneath it */
  #composer.composing #cmpInput, #composer.composing #cmpMirror {
    white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word;
    padding-bottom: 25px;
  }
  #cmpInput {
    position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box;
    margin: 0; border: 0; outline: none; background: transparent; resize: none; overflow: hidden;
    color: var(--text-primary); display: block;
  }
  #composer.composing #cmpInput { overflow-y: auto; }
  #cmpInput::placeholder { color: var(--text-tertiary); }
  /* measured off-screen so the live field's height is only ever written once */
  #cmpMirror { position: absolute; left: 0; right: 0; top: 0; height: auto; visibility: hidden; pointer-events: none; }

  /* drawn, never a glyph — ⇧ / ↵ can't be trusted to render without a webfont */
  kbd.kb {
    display: inline-flex; align-items: center; justify-content: center;
    height: 15px; min-width: 15px; padding: 0 3px; box-sizing: border-box;
    background: var(--bg-muted); border: 1px solid var(--border-default);
    border-radius: var(--radius-sm); color: var(--text-tertiary);
    vertical-align: middle; line-height: 0; font: inherit;
  }
  kbd.kb + kbd.kb { margin-left: 3px; }
  kbd.kb > svg { display: block; width: 11px; height: 11px; flex: none; }
  kbd.kb.txt { padding: 0 4px; font-family: var(--font-sans); font-size: 9px; line-height: 1; font-weight: var(--weight-medium); color: var(--text-secondary); }
  .cmp-hint {
    position: absolute; right: 0; bottom: 0; z-index: 2;
    padding: 5px 9px 6px 20px;
    /* scrim, so lines scrolling past the bottom edge don't read through it */
    background: linear-gradient(to right, transparent, var(--bg-subtle) 18px);
    display: inline-flex; align-items: center; font-size: 10px; line-height: 15px;
    color: var(--text-tertiary); pointer-events: none;
    opacity: 0; transform: translateY(3px);
    /* leaving is quick and undelayed, so it's gone before the field collapses
       back onto one line and can't smear over the placeholder */
    transition: opacity 110ms var(--ease-out), transform 110ms var(--ease-out);
  }
  #composer.composing .cmp-hint { opacity: 1; transform: none; transition: opacity 180ms var(--ease-out) 90ms, transform 180ms var(--ease-out) 90ms; }
  .cmp-hint .lbl { margin-left: 6px; }
  #cmpInline {
    flex: 1 1 auto; min-width: 0; color: var(--text-secondary); line-height: 17px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transform: translateX(-6px);
    transition: opacity 180ms var(--ease-out), transform 220ms var(--ease-out);
  }
  #composer.composing #cmpInline { opacity: 1; transform: none; transition-delay: 110ms; }
  .cmp-spacer { flex: 1 1 auto; }
  #composer.composing .cmp-spacer { display: none; }
  .cmp-row { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  #cmpCount { display: flex; align-items: center; gap: 2px; padding: 3px; background: var(--bg-muted); border-radius: var(--radius-full); }
  #cmpCount button { width: 26px; height: 26px; border-radius: var(--radius-full); border: none; background: none; color: var(--text-secondary); cursor: pointer; font-size: 14px; line-height: 1; font-family: var(--font-sans); font-weight: var(--weight-medium); transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  #cmpCount button:hover:not(:disabled) { background: var(--pill-active); color: var(--text-primary); }
  #cmpCount button:disabled { opacity: .35; cursor: default; }
  #cmpN {
    width: 34px; height: 26px; padding: 0; border: none; background: none; text-align: center; outline: none;
    color: var(--text-primary); font-size: 12px; font-family: var(--font-sans); font-weight: var(--weight-semibold);
    -moz-appearance: textfield;
  }
  #cmpN::-webkit-outer-spin-button, #cmpN::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #cmpN:focus { background: var(--pill-active); border-radius: var(--radius-full); box-shadow: var(--shadow-sm); }
  #cmpGo { height: 32px; padding: 0 16px; border-radius: var(--radius-full); border: 0; background: var(--accent); color: var(--accent-fg); font-weight: var(--weight-medium); font-family: var(--font-sans); font-size: 12px; cursor: pointer; transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  #cmpGo:hover { background: var(--accent-hover); }
  #cmpGo:active { transform: scale(.98); }
  /* Reserves no row at rest — a zero-height sliver that opens only when there
     is something to say, on the panel's own curve, then collapses back to bare. */
  .cmp-note {
    height: 0; margin-top: 0; overflow: hidden; color: var(--text-secondary);
    line-height: 17px; white-space: nowrap; text-overflow: ellipsis;
    opacity: 0; transform: translateY(-3px);
    transition: height var(--dur-snap) var(--ease-out), margin-top var(--dur-snap) var(--ease-out),
                opacity 170ms var(--ease-out), transform var(--dur-snap) var(--ease-out);
  }
  #composer.noted .cmp-note { height: 17px; margin-top: 7px; opacity: 1; transform: none; }
  .cmp-note .dot { display: inline-block; width: 5px; height: 5px; border-radius: var(--radius-full); background: var(--text-primary); vertical-align: 1px; margin-right: 6px; }
  #cmpGo { flex: none; }
  #cmpGo:disabled { opacity: .45; cursor: default; }
  #composer.offline #cmpField, #composer.offline #cmpCount, #composer.offline #cmpMode { opacity: .5; pointer-events: none; }
  /* multi-select: the panel would sit on top of the very nodes being combined,
     so it leaves the canvas and floats fixed at the bottom instead */
  #composer.at-bottom {
    left: 50%; top: auto; bottom: 18px; transform: translateX(-50%);
  }
  /* docked inside the inspect overlay: centered just above the control bar */
  #composer.in-inspect {
    z-index: 45; width: 320px; left: 50%; top: auto;
    bottom: calc((100vh - min(88vh, 860px)) / 2 + 64px);
    transform: translateX(-50%); box-shadow: var(--shadow-pop);
  }
  #composer.in-inspect.composing { width: 520px; }
  @media (prefers-reduced-motion: reduce) {
    #composer, #cmpField, .cmp-note, .cmp-hint, #cmpInline { transition: none !important; }
  }

  /* inspect overlay */
  #inspect { position: fixed; inset: 0; z-index: 40; background: var(--bg-overlay); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; animation: inspFade var(--dur-base) var(--ease-out); }
  .insp-panel { width: min(1180px, 94vw); height: min(88vh, 860px); background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-pop); animation: inspPop var(--dur-base) var(--ease-out); }
  .insp-head { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); }
  .insp-meta { flex: 1; min-width: 0; }
  .insp-name { font-size: var(--text-lg); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-heading); color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .insp-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .insp-tag { font-size: var(--text-xs); color: var(--text-secondary); background: var(--bg-muted); border: 0; padding: 5px 10px; border-radius: var(--radius-full); flex: none; font-weight: var(--weight-medium); }
  .insp-close { width: 34px; height: 34px; border-radius: var(--radius-full); border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-secondary); cursor: pointer; font-size: 14px; flex: none; transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  .insp-close:hover { background: var(--bg-subtle); border-color: var(--border-strong); color: var(--text-primary); }
  .insp-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; background: var(--bg-page); min-height: 0; }
  .insp-frame { background: #000; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-lg); max-width: 100%; max-height: 100%; }
  .insp-frame iframe { display: block; border: 0; width: 100%; height: 100%; }
  .insp-paused { position: absolute; top: 28px; left: 28px; background: var(--bg-inverse); color: var(--text-inverse); font-size: 12px; font-weight: var(--weight-semibold); padding: 6px 12px; border-radius: var(--radius-full); box-shadow: var(--shadow-md); }
  .insp-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border-subtle); flex-wrap: wrap; }
  .insp-aspect { display: flex; gap: 2px; padding: 3px; background: var(--bg-muted); border-radius: var(--radius-full); }
  .insp-aspect button { padding: 6px 12px; border-radius: var(--radius-full); border: none; background: none; color: var(--text-secondary); cursor: pointer; font-size: 12px; font-family: var(--font-sans); font-weight: var(--weight-medium); transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  .insp-aspect button:hover { color: var(--text-primary); }
  .insp-aspect button.on { background: var(--pill-active); color: var(--text-primary); box-shadow: var(--shadow-sm); font-weight: var(--weight-semibold); }
  .insp-actions { display: flex; gap: 6px; }
  .insp-actions button { padding: 0 16px; height: 36px; border-radius: var(--radius-full); border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-primary); cursor: pointer; font-size: 12px; font-family: var(--font-sans); font-weight: var(--weight-medium); transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  .insp-actions button:hover { background: var(--bg-subtle); border-color: var(--border-strong); }
  .insp-actions button:active { transform: scale(.98); }
  .insp-actions button:disabled { opacity: .4; cursor: default; pointer-events: none; }
  #ispPick { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  #ispPick:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  #ispPick.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: var(--weight-semibold); }
  @keyframes inspFade { from { opacity: 0; } }
  @keyframes inspPop { from { opacity: 0; transform: scale(.98) translateY(6px); } }

  /* toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 16px);
    z-index: 50; background: var(--bg-inverse); border: 0; color: var(--text-inverse);
    font-size: 13px; font-weight: var(--weight-semibold); padding: 12px 16px; border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg); opacity: 0; transition: .25s var(--ease-out); pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="canvas">
    <div id="world">
      <svg id="edges"></svg>
    </div>
  </div>

  <div id="hud">
    <div><b><a href="/" title="All sessions">Composer</a></b> · <span id="sessName"></span> · <select id="taskSel" title="Switch task"></select> · <span id="live">○ connecting…</span></div>
  </div>

  <div id="toolbar">
    <button id="tbZoomOut" title="Zoom out ( - )">−</button>
    <button id="tbZoomIn" title="Zoom in ( + )">+</button>
    <button id="tbFit" title="Fit view ( 0 )">Fit</button>
  </div>

  <button id="themeToggle" title="Toggle light / dark" aria-label="Toggle light / dark">☾</button>

  <canvas id="minimap" width="150" height="96"></canvas>

  <div id="composer" hidden>
    <div id="cmpMode">
      <button type="button" data-m="derive" class="on">Derive</button><button type="button" data-m="adjust">Adjust</button>
    </div>
    <div class="cmp-imgs" id="cmpImgs"></div>
    <div id="cmpField">
      <div id="cmpMirror" aria-hidden="true"></div>
      <textarea id="cmpInput" rows="1" placeholder="Type something..."></textarea>
      <div class="cmp-hint" aria-hidden="true">
        <kbd class="kb"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 5.6 6 2.8l2.8 2.8"/><path d="M6 2.9v4.6"/><path d="M3.9 9.5h4.2"/></svg></kbd><kbd class="kb"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.4 3v3.9H3.3"/><path d="M5.3 4.9 3.2 6.9l2.1 2"/></svg></kbd><span class="lbl">newline</span>
      </div>
    </div>
    <div class="cmp-row">
      <div id="cmpCount">
        <button id="cmpMinus" type="button" title="Fewer variants">−</button>
        <input id="cmpN" type="number" min="1" max="12" step="1" value="3" title="How many variants to generate (1–12)" />
        <button id="cmpPlus" type="button" title="More variants">+</button>
      </div>
      <div id="cmpInline"></div>
      <div class="cmp-spacer"></div>
      <button id="cmpGo">Derive</button>
    </div>
    <div id="cmpNote" class="cmp-note"></div>
  </div>

  <div id="inspect" hidden>
    <div class="insp-panel">
      <div class="insp-head">
        <div class="insp-meta">
          <div class="insp-name" id="ispName"></div>
          <div class="insp-desc" id="ispDesc"></div>
        </div>
        <div class="insp-tag" id="ispModel"></div>
        <button class="insp-close" id="ispClose" title="Close (Esc)">✕</button>
      </div>
      <div class="insp-stage" id="ispStage">
        <div class="insp-frame" id="ispFrame"></div>
        <div class="insp-paused" id="ispPaused" hidden>❚❚ Paused</div>
      </div>
      <div class="insp-controls">
        <div class="insp-aspect" id="ispAspect">
          <button data-a="16:9" class="on">16:9</button><button data-a="21:9">21:9</button><button data-a="1:1">1:1</button><button data-a="9:16">9:16</button>
        </div>
        <div class="insp-actions">
          <button id="ispDerive" title="Derive from this variant ( I )">Derive…</button>
          <button id="ispPause">Pause</button>
          <button id="ispRestart">Restart</button>
          <button id="ispPick">Pick this one</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
/* ---------- constants ---------- */
var NODE_W = 300, NODE_H = 215;
/* which project session + task this board shows: /b/<session>?task=<slug> */
var SESSION = (location.pathname.match(/^\/b\/([A-Za-z0-9_-]+)/) || [null, 'demo'])[1];
var API = '/api/s/' + SESSION;
var TASK = new URLSearchParams(location.search).get('task');
var TASKS = [];
var fleetLive = false;
var POS_KEY = 'composer-pos'; // rescoped per session+task on boot

/* ---------- state ---------- */
/* selected is an ordered list — shift+click grows it; a plain click collapses
   it back to one. The last id is the anchor (composer placement, keyboard nav). */
var state = { nodes: [], ghosts: [], camera: { x: 0, y: 0, scale: 0.8 }, selected: [], winner: null, inspectId: null };
var cam = state.camera;
var nodeEls = {};   // real + ghost elements, keyed by node id
var drag = null;
var cmpCount = 3;
var CMP_MIN = 1, CMP_MAX = 12;
var currentAspect = '16:9';
var inspIframe = null, insPausedState = false;
var didFit = false;
var savedPos = {}; // loaded on boot once the task is known

/* ---------- dom refs ---------- */
var canvas = document.getElementById('canvas');
var world  = document.getElementById('world');
var edgesSvg = document.getElementById('edges');
var composer = document.getElementById('composer');
var cmpModeEl = document.getElementById('cmpMode');
var cmpInput = document.getElementById('cmpInput');
var cmpField = document.getElementById('cmpField');
var cmpMirror = document.getElementById('cmpMirror');
var cmpInline = document.getElementById('cmpInline');
var cmpGo = document.getElementById('cmpGo');
var cmpN = document.getElementById('cmpN');
var cmpMinus = document.getElementById('cmpMinus');
var cmpPlus = document.getElementById('cmpPlus');
var cmpNote = document.getElementById('cmpNote');
var cmpImgs = document.getElementById('cmpImgs');
var mini = document.getElementById('minimap');
var inspect = document.getElementById('inspect');
var ispName = document.getElementById('ispName');
var ispDesc = document.getElementById('ispDesc');
var ispModel = document.getElementById('ispModel');
var ispFrame = document.getElementById('ispFrame');
var ispStage = document.getElementById('ispStage');
var inspPaused = document.getElementById('ispPaused');
var ispAspect = document.getElementById('ispAspect');
var ispPause = document.getElementById('ispPause');
var ispRestart = document.getElementById('ispRestart');
var ispPick = document.getElementById('ispPick');
var ispClose = document.getElementById('ispClose');
var toastEl = document.getElementById('toast');

/* ---------- helpers ---------- */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function allNodes() { return state.nodes.concat(state.ghosts); }
function byId(id) { var a = allNodes(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
function isSelected(id) { return state.selected.indexOf(id) >= 0; }
function selNodes() {
  return state.selected.map(byId).filter(function (n) { return n && !n.building; });
}
function selPrimary() {
  var s = selNodes();
  return s.length ? s[s.length - 1] : null;
}
function screenToWorld(sx, sy) { return { x: (sx - cam.x) / cam.scale, y: (sy - cam.y) / cam.scale }; }
function modelColor(m) {
  if (/opus/.test(m)) return '#e0aa5a';
  if (/sonnet/.test(m)) return '#7c9cff';
  if (/haiku/.test(m)) return '#5ee08a';
  if (/fable/.test(m)) return '#c07cff';
  return '#8a9099';
}
function savePositions() {
  var out = {};
  state.nodes.forEach(function (n) { out[n.id] = { x: Math.round(n.x), y: Math.round(n.y) }; });
  try { localStorage.setItem(POS_KEY, JSON.stringify(out)); } catch (e) {}
}
var toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3200);
}

/* inject pause listener before </body>; script tags split so no literal close-tag hits the outer parser */
function withPause(html) {
  var scr = '<scr' + 'ipt>(function(){var s=document.createElement("style");' +
    's.textContent="*{animation-play-state:paused!important;-webkit-animation-play-state:paused!important}";' +
    'window.addEventListener("message",function(e){if(e.data==="pause"){if(!s.parentNode)document.documentElement.appendChild(s)}' +
    'else if(e.data==="play"){if(s.parentNode)s.parentNode.removeChild(s)}});' +
    'window.addEventListener("keydown",function(e){if(e.key==="Escape"||(e.key&&e.key.indexOf("Arrow")===0)){' +
    'e.preventDefault();parent.postMessage({composerKey:e.key},"*")}})})();<\/scr' + 'ipt>';
  return html.indexOf('</body>') !== -1 ? html.replace('</body>', scr + '</body>') : html + scr;
}

/* ---------- camera ---------- */
function applyCamera() {
  world.style.transform = 'translate(' + cam.x + 'px,' + cam.y + 'px) scale(' + cam.scale + ')';
  canvas.style.backgroundPosition = cam.x + 'px ' + cam.y + 'px';
  var g = 40 * cam.scale;
  canvas.style.backgroundSize = g + 'px ' + g + 'px';
  syncComposer();
  renderMinimap();
}
function zoomBy(f) {
  var mx = window.innerWidth / 2, my = window.innerHeight / 2;
  var wx = (mx - cam.x) / cam.scale, wy = (my - cam.y) / cam.scale;
  cam.scale = clamp(cam.scale * f, 0.15, 2.5);
  cam.x = mx - wx * cam.scale;
  cam.y = my - wy * cam.scale;
  applyCamera();
}
function fitView() {
  var a = allNodes();
  if (!a.length) return;
  var minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  a.forEach(function (n) {
    minx = Math.min(minx, n.x); miny = Math.min(miny, n.y);
    maxx = Math.max(maxx, n.x + NODE_W); maxy = Math.max(maxy, n.y + NODE_H);
  });
  var bw = maxx - minx, bh = maxy - miny, pad = 90;
  var s = clamp(Math.min((window.innerWidth - pad * 2) / bw, (window.innerHeight - pad * 2 - 40) / bh), 0.15, 1.4);
  cam.scale = s;
  cam.x = window.innerWidth / 2 - (minx + bw / 2) * s;
  cam.y = (window.innerHeight / 2 + 20) - (miny + bh / 2) * s;
  applyCamera();
}

/* ---------- placement ---------- */
function collides(x, y, ignoreId) {
  return allNodes().some(function (o) {
    return o.id !== ignoreId && Math.abs(o.x - x) < NODE_W + 20 && Math.abs(o.y - y) < NODE_H + 20;
  });
}
function placeChild(parent, i, count) {
  var gap = 60;
  var total = count * NODE_W + (count - 1) * gap;
  var x = parent.x + NODE_W / 2 - total / 2 + i * (NODE_W + gap);
  var y = parent.y + NODE_H + 140;
  while (collides(x, y, null)) y += NODE_H + 40;
  return { x: x, y: y };
}
function placeRoot(i) {
  var x = 60 + i * (NODE_W + 120), y = 90;
  while (collides(x, y, null)) y += NODE_H + 40;
  return { x: x, y: y };
}
/* a freshly arrived variant takes over a ghost slot of its parent's pending
   derive request, so it lands exactly where the "building…" card was */
var ghostFill = {}; // reqId -> ghost slots already consumed by arrived variants
function adoptGhostSlot(parentId) {
  for (var i = 0; i < state.ghosts.length; i++) {
    var g = state.ghosts[i];
    if (g.parentId !== parentId) continue;
    ghostFill[g.reqId] = (ghostFill[g.reqId] || 0) + 1;
    state.ghosts.splice(i, 1);
    removeNodeEl(g.id);
    return { x: g.x, y: g.y };
  }
  return null;
}
function placeNewChild(parent) {
  var sibs = state.nodes.filter(function (n) { return n.parentId === parent.id; });
  if (!sibs.length) return placeChild(parent, 0, 1);
  var right = sibs[0];
  sibs.forEach(function (s) { if (s.x > right.x) right = s; });
  var x = right.x + NODE_W + 60, y = right.y;
  while (collides(x, y, null)) x += NODE_W + 60;
  return { x: x, y: y };
}

/* ---------- nodes ---------- */
function createNodeEl(n) {
  var d = document.createElement('div');
  d.className = 'node';
  d.style.width = NODE_W + 'px';
  d.innerHTML =
    '<div class="crown">♔</div>' +
    '<button class="expand" title="Expand">⤢</button>' +
    '<div class="preview"><div class="scaler"><iframe sandbox="allow-scripts" scrolling="no"></iframe></div>' +
    '<div class="build"><div class="spin"></div><span>building…</span><span class="req"></span>' +
    '<button class="cancel" type="button" title="Cancel this derive request">Cancel</button></div></div>' +
    '<div class="foot"><span class="nm"></span><span class="mdl"><i></i><span class="mt"></span></span></div>' +
    '<div class="adj shimmer"><div class="spin"></div><span class="tw"></span>' +
    '<button class="cancel" type="button" title="Cancel this adjust">Cancel</button></div>' +
    '<div class="rail" hidden><span class="rl"></span><div class="chips"></div></div>';
  d.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    e.stopPropagation();
    // shift+click grows / shrinks the multi-selection and never drags
    if (!n.building && e.shiftKey) { toggleSelect(n.id); return; }
    // an already-selected node keeps the group on mousedown so it can be
    // dragged without collapsing; a still click collapses on mouseup
    if (!n.building && !isSelected(n.id)) select(n.id);
    drag = { mode: 'node', id: n.id, lastX: e.clientX, lastY: e.clientY, moved: 0 };
  });
  d.addEventListener('dblclick', function (e) { e.stopPropagation(); if (!n.building) openInspect(n.id); });
  var ex = d.querySelector('.expand');
  ex.addEventListener('mousedown', function (e) { e.stopPropagation(); });
  ex.addEventListener('click', function (e) { e.stopPropagation(); if (!n.building) openInspect(n.id); });
  var cx = d.querySelector('.build .cancel');
  cx.addEventListener('mousedown', function (e) { e.stopPropagation(); });
  cx.addEventListener('click', function (e) { e.stopPropagation(); if (n.reqId) cancelRequest(n.reqId); });
  var ax = d.querySelector('.adj .cancel');
  ax.addEventListener('mousedown', function (e) { e.stopPropagation(); });
  ax.addEventListener('click', function (e) { e.stopPropagation(); if (n.adjusting) cancelRequest(n.adjusting.reqId); });
  var rl = d.querySelector('.rail');
  rl.addEventListener('mousedown', function (e) { e.stopPropagation(); });
  rl.addEventListener('dblclick', function (e) { e.stopPropagation(); });
  world.appendChild(d);
  nodeEls[n.id] = d;
  updateNodePos(n);
  updateNodeVisual(n);
  if (!n.building) {
    var ifr = d.querySelector('iframe');
    if (n.url) { ifr.setAttribute('sandbox', 'allow-scripts allow-same-origin'); ifr.src = n.url; }
    else ifr.srcdoc = n.html;
  }
  if (n.building && n.reqText) d.querySelector('.req').textContent = '“' + n.reqText + '”';
}
function removeNodeEl(id) {
  if (nodeEls[id]) { nodeEls[id].remove(); delete nodeEls[id]; }
}
function updateNodePos(n) {
  var d = nodeEls[n.id];
  d.style.left = n.x + 'px';
  d.style.top = n.y + 'px';
}
function updateNodeVisual(n) {
  var d = nodeEls[n.id];
  d.classList.toggle('selected', isSelected(n.id));
  d.classList.toggle('winner', winnerNodeId() === n.id);
  d.classList.toggle('building', !!n.building);
  d.querySelector('.nm').textContent = n.name;
  d.querySelector('.mt').textContent = n.model;
  d.querySelector('.mdl i').style.background = modelColor(n.model);
}

/* ---------- revisions (adjusts) ----------
   An adjust variant (meta "adjust":true) is a REVISION of its parent, not a
   branch: the whole parent-chain of adjust files folds into one node whose
   rail shows v1·v2·… chips. state.winner is a FILE id — map it to its node. */
var fileToNode = {}; // variant file -> the node (revision root) it belongs to

/* ---------- edges ---------- */
function edgePath(p, ch) {
  var x1 = p.x + NODE_W / 2, y1 = p.y + NODE_H;
  var x2 = ch.x + NODE_W / 2, y2 = ch.y;
  var dy = Math.max(40, (y2 - y1) / 2);
  return 'M' + x1 + ',' + y1 + ' C' + x1 + ',' + (y1 + dy) + ' ' + x2 + ',' + (y2 - dy) + ' ' + x2 + ',' + y2;
}
function renderEdges() {
  var s = '';
  allNodes().forEach(function (n) {
    if (n.parentId != null) {
      var p = byId(n.parentId);
      if (p) s += '<path class="edge' + (n.building ? ' ghostly' : '') + '" d="' + edgePath(p, n) + '"/>';
    }
    // a multi-parent derive draws a ghostly strand from each extra parent too
    (n.extraParents || []).forEach(function (pid) {
      var xp = byId(pid);
      if (xp) s += '<path class="edge ghostly" d="' + edgePath(xp, n) + '"/>';
    });
  });
  edgesSvg.innerHTML = s;
}

/* ---------- selection ---------- */
function select(id) {
  state.selected = id == null ? [] : [id];
  allNodes().forEach(updateNodeVisual);
  syncComposer();
}
function toggleSelect(id) {
  var i = state.selected.indexOf(id);
  if (i >= 0) state.selected.splice(i, 1);
  else state.selected.push(id);
  allNodes().forEach(updateNodeVisual);
  syncComposer();
}
function syncComposer() {
  var sel = selNodes();
  if (!sel.length) { composer.hidden = true; return; }
  var n = sel[sel.length - 1]; // anchor next to the freshest selection
  composer.hidden = false;
  // adjust targets exactly one node — a multi-selection falls back to derive
  cmpModeEl.querySelector('[data-m="adjust"]').disabled = sel.length > 1;
  if (sel.length > 1 && cmpModeType === 'adjust') setCmpModeType('derive');
  if (composer.classList.contains('in-inspect')) { composer.classList.remove('at-bottom'); composer.style.left = ''; composer.style.top = ''; return; }
  // combining several: float fixed at the bottom, clear of the selected nodes
  composer.classList.toggle('at-bottom', sel.length > 1);
  if (sel.length > 1) { composer.style.left = ''; composer.style.top = ''; return; }
  var sx = n.x * cam.scale + cam.x, sy = n.y * cam.scale + cam.y;

  // against the target width rather than whatever this frame happens to measure
  var w = cmpPanelWidth(cmpMode), h = composer.offsetHeight || 150;
  var left = sx + NODE_W * cam.scale + 14;
  if (left + w > window.innerWidth - 10) left = sx - w - 14;
  if (left < 10) left = 10;

  composer.style.top = top + 'px';
}

/* ---------- keyboard navigation ---------- */
/* left/right walk siblings (roots count as siblings of each other),
   down descends into the selected node's children — so navigation stays

function navSort(list) { return list.sort(function (a, b) { return a.x - b.x || a.y - b.y; }); }

  var pid = n.parentId || null;
  return navSort(state.nodes.filter(function (o) { return (o.parentId || null) === pid; }));
}
function navTo(n) {
  if (!n) return;
  select(n.id);
  /* pan just enough to keep the node in view (36px margin, topbar excluded) */
  var m = 36;
  var x1 = n.x * cam.scale + cam.x, y1 = n.y * cam.scale + cam.y;
  var x2 = x1 + NODE_W * cam.scale, y2 = y1 + NODE_H * cam.scale;
  var dx = 0, dy = 0;
  if (x1 < m) dx = m - x1; else if (x2 > window.innerWidth - m) dx = window.innerWidth - m - x2;
  if (y1 < m + 44) dy = m + 44 - y1; else if (y2 > window.innerHeight - m) dy = window.innerHeight - m - y2;
  if (dx || dy) { cam.x += dx; cam.y += dy; applyCamera(); }
}
function navArrow(key) {
  var cur = selPrimary();
  if (!cur) {
    navTo(navSort(state.nodes.filter(function (n) { return n.parentId == null; }))[0]);
    return;
  }
  var sibs = navSiblingsOf(cur), i = sibs.indexOf(cur);
  if (key === 'ArrowLeft') navTo(sibs[i - 1]);
  else if (key === 'ArrowRight') navTo(sibs[i + 1]);
  else if (key === 'ArrowDown') {
    var kids = navChildren(cur.id);
    if (!kids.length) return;
    var best = kids[0], cx = cur.x + NODE_W / 2;
    kids.forEach(function (k) {
      if (Math.abs(k.x + NODE_W / 2 - cx) < Math.abs(best.x + NODE_W / 2 - cx)) best = k;

  navArrow(key);
  p = selPrimary();
  if (inspecting && p && p.id !== state.inspectId) openInspect(p.id);

/* ---------- server sync ---------- */
function refreshVariants(announce) {
  return fetch(API + '/t/' + TASK + '/variants').then(function (r) { return r.json(); }).then(function (list) {
    // fold adjust chains into their revision root: one node, many revisions
    var map = {};
    list.forEach(function (v) { map[v.id] = v; });
    function rootIdOf(id) {
      var v = map[id], guard = 0;
      while (v && v.adjust && v.parent && map[v.parent] && guard++ < 100) v = map[v.parent];
      return v ? v.id : id;
    }
    var groups = {}, order = [];
    fileToNode = {};
    list.forEach(function (v) {
      var rid = rootIdOf(v.id);
      fileToNode[v.id] = rid;
      if (!groups[rid]) { groups[rid] = []; order.push(rid); }
      groups[rid].push(v);
    });
    var seen = {};
    var added = 0;
    var rootIdx = state.nodes.filter(function (n) { return n.parentId == null; }).length;
    order.forEach(function (rid) {
      seen[rid] = true;
      var revs = groups[rid];
      var root = map[rid] || revs[0];
      var parentId = root.parent ? (fileToNode[root.parent] || root.parent) : null;
      var existing = byId(rid);
      if (existing) {
        var grew = revs.length - (existing.revs ? existing.revs.length : 1);
        existing.revs = revs;
        existing.parentId = parentId;
        // a fresh revision becomes the shown one; otherwise stay where the user was
        setRev(existing, grew > 0 ? revs.length - 1 : existing.rev || 0);
        if (grew > 0) added += grew;
        return;
      }
      var pos = savedPos[rid];
      if (!pos) {
        var parent = parentId ? byId(parentId) : null;
        pos = parent ? (adoptGhostSlot(parent.id) || placeNewChild(parent)) : placeRoot(rootIdx++);
      }
      var n = { id: rid, revs: revs, rev: revs.length - 1, parentId: parentId, x: pos.x, y: pos.y, building: false };
      var r = revs[n.rev];
      n.name = r.name; n.model = r.model; n.description = r.description; n.html = r.html; n.url = r.url;
      n._shown = r.id;
      state.nodes.push(n);
      createNodeEl(n);
      renderRail(n);
      added += revs.length;
    });
    state.nodes = state.nodes.filter(function (n) {
      if (seen[n.id]) return true;
      removeNodeEl(n.id);
      var si = state.selected.indexOf(n.id);
      if (si >= 0) { state.selected.splice(si, 1); syncComposer(); }
      return false;
    });
    renderEdges();
    renderMinimap();
    if (!didFit && state.nodes.length) { didFit = true; fitView(); }
    if (announce && added > 0) toast(added + ' new variant' + (added > 1 ? 's' : '') + ' arrived ✨');
  });
}

function refreshRequests() {
  return fetch(API + '/t/' + TASK + '/requests').then(function (r) { return r.json(); }).then(function (reqs) {
    // the winner is server-side state: the newest non-cancelled pick request
    var w = null;
    for (var i = 0; i < reqs.length; i++) {
      if (reqs[i].type === 'pick' && reqs[i].status !== 'cancelled' && reqs[i].variants && reqs[i].variants[0]) { w = reqs[i].variants[0]; break; }
    }
    if (w !== state.winner) {
      state.winner = w;
      allNodes().forEach(updateNodeVisual);
      if (state.inspectId) {
        ispPick.textContent = winnerNodeId() === state.inspectId ? 'Winner ✓' : 'Pick this one';
        ispPick.classList.toggle('on', winnerNodeId() === state.inspectId);
      }
    }
    // ghost nodes for open derive requests (those that carry a count)
    var wanted = {};
    reqs.forEach(function (rq) {
      if (rq.status === 'done' || rq.status === 'cancelled' || !rq.count || !rq.variants || !rq.variants.length) return;
      var parent = byId(fileToNode[rq.variants[0]] || rq.variants[0]);
      if (!parent || parent.building) return;
      for (var i = ghostFill[rq.id] || 0; i < rq.count; i++) {
        var gid = 'ghost:' + rq.id + ':' + i;
        wanted[gid] = true;
        if (byId(gid)) continue;
        var pos = placeChild(parent, i, rq.count);
        var g = {
          id: gid, name: 'building…', model: 'fleet', description: '',
          parentId: parent.id,
          extraParents: rq.variants.slice(1).map(function (f) { return fileToNode[f] || f; }),
          html: '', x: pos.x, y: pos.y, building: true, reqText: rq.text, reqId: rq.id

      }

    state.ghosts = state.ghosts.filter(function (g) {
      if (wanted[g.id]) return true;
      removeNodeEl(g.id);
      return false;
    });
    // open adjust requests shimmer their node in place — no ghost, no branch

    reqs.forEach(function (rq) {
      if (rq.type !== 'adjust' || rq.status === 'done' || rq.status === 'cancelled' || !rq.variants || !rq.variants.length) return;
      var nid = fileToNode[rq.variants[0]] || rq.variants[0];
      // show just the tweak — the "Adjust "name" — " preamble is for the fleet
      if (!adjWanted[nid]) adjWanted[nid] = { reqId: rq.id, text: rq.text.replace(/^Adjust "[^"]*" — /, '') };
    });

    renderMinimap();
  });
}

function cancelRequest(reqId) {
  // allowed even when the fleet is offline — it only retracts work
  fetch(API + '/t/' + TASK + '/requests/' + reqId + '/cancel', { method: 'POST' }).then(function (r) {
    if (r.ok) toast('Generation cancelled');
    refreshRequests();
  });
}

function sendRequest(text, variantIds, count, type, images) {
  var body = { text: text, variants: variantIds };
  if (count) body.count = count;
  if (type) body.type = type;
  if (images && images.length) body.images = images;
  return fetch(API + '/t/' + TASK + '/requests', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
}

/* ---------- derive (core) ---------- */
function doDerive() {
  var parents = selNodes();
  if (!parents.length) return;
  if (!fleetLive) { cmpShowNote('Fleet offline — run /composer to reconnect.'); return; }
  if (!cmpImagesReady()) { cmpShowNote('Still uploading an image…', 2600); return; }
  var req = cmpInput.value.trim();
  var imgs = cmpImages.map(function (i) { return i.file; });
  var names = parents.map(function (p) { return '"' + p.name + '"'; }).join(' + ');
  var text = 'Derive ' + cmpCount + ' new variant' + (cmpCount > 1 ? 's' : '') +
    (parents.length > 1 ? ' combining ' + names : ' from ' + names) + (req ? ' — ' + req : '') +
    (imgs.length ? ' (see the ' + (imgs.length > 1 ? imgs.length + ' attached reference images' : 'attached reference image') + ')' : '');
  // derive from what is on screen: the ACTIVE revision of each parent
  var ids = parents.map(activeRevId);
  sendRequest(text, ids, cmpCount, 'derive', imgs).then(function () {
    cmpInput.value = '';
    cmpClearImages();
    cmpLayout(true);   // collapse straight back to the bare chip
    cmpShowNote('<i class="dot"></i>Sent · ' + cmpCount + ' variant' + (cmpCount > 1 ? 's' : ''), 3800);
    refreshRequests();
  });
}

/* ---------- adjust (same design, one small tweak) ---------- */
function doAdjust() {
  var n = selPrimary();
  if (!n) return;
  if (!fleetLive) { cmpShowNote('Fleet offline — run /composer to reconnect.'); return; }
  var req = cmpInput.value.trim();
  if (!req) { cmpShowNote('Describe the tweak first.', 2600); return; }
  sendRequest('Adjust "' + n.name + '" — ' + req, [activeRevId(n)], null, 'adjust').then(function () {
    cmpInput.value = '';
    cmpLayout(true);
    cmpShowNote('<i class="dot"></i>Sent · adjust', 3800);
    refreshRequests();
  });
}
function doSend() { if (cmpModeType === 'adjust') doAdjust(); else doDerive(); }

/* ---------- inspect ---------- */

  inspect.hidden = false;
  ispName.textContent = n.name;
  ispDesc.textContent = n.description;
  ispModel.textContent = n.model;
  ispPick.textContent = winnerNodeId() === id ? 'Winner ✓' : 'Pick this one';
  ispPick.classList.toggle('on', winnerNodeId() === id);

  setAspect(currentAspect);
}

  } else {

}

function setWinner(id) {

  var n = byId(id);
  if (!n) return;
  var file = activeRevId(n); // the winner is the revision on screen
  state.winner = file; // optimistic; server truth arrives via refreshRequests
  allNodes().forEach(updateNodeVisual);
  renderMinimap();
  if (state.inspectId) {
    ispPick.textContent = winnerNodeId() === state.inspectId ? 'Winner ✓' : 'Pick this one';
    ispPick.classList.toggle('on', winnerNodeId() === state.inspectId);
  }
  sendRequest('Pick "' + n.name + '" — implement this design.', [file], null, 'pick').then(refreshRequests);
}

/* ---------- minimap ---------- */
function renderMinimap() {
  var ctx = mini.getContext('2d');
  var W = mini.width, H = mini.height;
  ctx.clearRect(0, 0, W, H);
  var a = allNodes();
  if (!a.length) return;
  var minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  a.forEach(function (n) {
    minx = Math.min(minx, n.x); miny = Math.min(miny, n.y);
    maxx = Math.max(maxx, n.x + NODE_W); maxy = Math.max(maxy, n.y + NODE_H);
  });
  var v0 = screenToWorld(0, 0), v1 = screenToWorld(window.innerWidth, window.innerHeight);
  minx = Math.min(minx, v0.x); miny = Math.min(miny, v0.y);
  maxx = Math.max(maxx, v1.x); maxy = Math.max(maxy, v1.y);
  var bw = maxx - minx, bh = maxy - miny, pad = 8;
  var s = Math.min((W - pad * 2) / bw, (H - pad * 2) / bh);
  var ox = pad - minx * s + (W - pad * 2 - bw * s) / 2;
  var oy = pad - miny * s + (H - pad * 2 - bh * s) / 2;
  a.forEach(function (n) {
    ctx.fillStyle = n.id === winnerNodeId() ? '#f5f5f5' : (n.building ? '#525252' : '#a3a3a3');
    ctx.fillRect(ox + n.x * s, oy + n.y * s, Math.max(2, NODE_W * s), Math.max(2, NODE_H * s));
  });
  ctx.strokeStyle = 'rgba(245,245,245,.7)';
  ctx.lineWidth = 1;
  ctx.strokeRect(ox + v0.x * s, oy + v0.y * s, (v1.x - v0.x) * s, (v1.y - v0.y) * s);
}

/* ---------- global pointer handlers ---------- */
canvas.addEventListener('mousedown', function (e) {
  if (e.button !== 0) return;
  drag = { mode: 'pan', lastX: e.clientX, lastY: e.clientY, moved: 0 };
});
window.addEventListener('mousemove', function (e) {
  if (!drag) return;
  var dx = e.clientX - drag.lastX, dy = e.clientY - drag.lastY;
  drag.lastX = e.clientX; drag.lastY = e.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.mode === 'pan') {
    cam.x += dx; cam.y += dy; applyCamera();
  } else {
    var n = byId(drag.id);
    if (n) { n.x += dx / cam.scale; n.y += dy / cam.scale; updateNodePos(n); renderEdges(); syncComposer(); renderMinimap(); }
  }
});
window.addEventListener('mouseup', function (e) {
  if (drag && drag.mode === 'pan' && drag.moved < 4) select(null);
  if (drag && drag.mode === 'node') {
    // a plain still click on a member of a multi-selection collapses to it
    var n = byId(drag.id);
    if (drag.moved < 4 && !e.shiftKey && n && !n.building) select(drag.id);
    savePositions();
  }
  drag = null;
});
canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  var wx = (mx - cam.x) / cam.scale, wy = (my - cam.y) / cam.scale;
  var factor = Math.exp(-e.deltaY * 0.0015);
  cam.scale = clamp(cam.scale * factor, 0.15, 2.5);
  cam.x = mx - wx * cam.scale;
  cam.y = my - wy * cam.scale;
  applyCamera();
}, { passive: false });

/* ---------- ui wiring ---------- */
document.getElementById('tbZoomOut').addEventListener('click', function () { zoomBy(1 / 1.2); });
document.getElementById('tbZoomIn').addEventListener('click', function () { zoomBy(1.2); });
document.getElementById('tbFit').addEventListener('click', fitView);

/* subtle light/dark toggle — canvas defaults to dark; only flips CSS tokens */
(function () {
  var tt = document.getElementById('themeToggle');
  function sync() { tt.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '☀' : '☾'; }
  sync();
  tt.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    sync();
  });
})();

/* ---------- the composer's two states ----------
   Resting is a one-line chip; composing is a textarea. There is no continuum
   between them: the moment the caret would run out of room the panel and field
   snap open together in one motion, and the hints arrive with it. Coming back
   needs both a quiet spell and a margin of slack, so it can't flap. */
var CMP_REST_H = 32, CMP_COMP_H = 108, CMP_COMP_H_MAX = 150;
var CMP_RETURN_DELAY = 400;   // ms of no typing before collapsing back
var CMP_HYSTERESIS = 14;      // px of slack required before returning
var CMP_CARET_SLACK = 8;      // the caret needs room too — snap just before it clips
var cmpMode = 'resting';
var cmpReturnTimer = null, cmpRemeasure = null, cmpSettle = null;

function cmpDocked() { return composer.classList.contains('in-inspect'); }
function cmpPanelWidth(mode) {
  if (cmpDocked()) return mode === 'composing' ? 520 : 320;
  return mode === 'composing' ? 412 : 230;
}
/* Usable text width of the RESTING field, derived rather than measured: while
   composing, the live panel is already wide, so there is nothing to measure.
   panel borders 2 + panel padding 24 + field borders 2 + field padding 20 */
function cmpRestingTextWidth() { return cmpPanelWidth('resting') - 48; }

var cmpMeas = document.createElement('span');
cmpMeas.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0;';
document.body.appendChild(cmpMeas);
function cmpTextWidth(s) {
  var cs = getComputedStyle(cmpInput);
  cmpMeas.style.font = cs.font;
  cmpMeas.style.letterSpacing = cs.letterSpacing;
  cmpMeas.textContent = s;
  return cmpMeas.getBoundingClientRect().width;
}

function cmpWantsComposing(v) {
  if (v.indexOf('\n') >= 0) return true;                 // an explicit newline needs the box
  return cmpTextWidth(v) + CMP_CARET_SLACK > cmpRestingTextWidth();
}
function cmpFitsResting(v) {
  if (v.indexOf('\n') >= 0) return false;
  return cmpTextWidth(v) + CMP_CARET_SLACK + CMP_HYSTERESIS <= cmpRestingTextWidth();
}

function cmpSetMode(next, immediate) {
  if (cmpMode === next) return;
  cmpMode = next;
  composer.classList.toggle('composing', next === 'composing');
  composer.classList.remove('settled');
  clearTimeout(cmpSettle);
  if (next === 'composing' && !immediate) {
    // once the snap has landed, later height changes get the quieter transition
    cmpSettle = setTimeout(function () { if (cmpMode === 'composing') composer.classList.add('settled'); }, 330);
  }
  cmpApplyPlaceholder();
  cmpSyncInline();
  syncComposer();
  // the panel's box is still animating; re-place once it has settled
  setTimeout(syncComposer, 330);
}

function cmpDecideMode(v, immediate) {
  if (cmpMode === 'resting') {
    clearTimeout(cmpReturnTimer);
    if (cmpWantsComposing(v)) cmpSetMode('composing', immediate);   // the snap: no debounce
  } else {
    if (!cmpFitsResting(v)) { clearTimeout(cmpReturnTimer); return; }
    clearTimeout(cmpReturnTimer);
    if (immediate) { cmpSetMode('resting', true); return; }
    cmpReturnTimer = setTimeout(function () {
      if (cmpFitsResting(cmpInput.value)) cmpSetMode('resting');
    }, CMP_RETURN_DELAY);
  }
}

function cmpMeasureHeight() {
  cmpMirror.textContent = cmpInput.value + '​';
  var h = Math.ceil(cmpMirror.getBoundingClientRect().height) + 2;
  cmpField.style.setProperty('--cmp-fh', clamp(h, CMP_COMP_H, CMP_COMP_H_MAX) + 'px');
}

function cmpLayout(immediate) {
  cmpDecideMode(cmpInput.value, immediate);
  if (cmpMode === 'composing') {
    cmpMeasureHeight();
    // the panel width is still in flight for one snap-length; re-measure after
    clearTimeout(cmpRemeasure);
    cmpRemeasure = setTimeout(function () { if (cmpMode === 'composing') cmpMeasureHeight(); }, 340);
  } else {
    cmpField.style.removeProperty('--cmp-fh');
  }
  cmpSyncInline();
}

/* the only written hint lives in the composing row, so it arrives with the snap */
function cmpSyncInline() {
  cmpInline.innerHTML = (cmpMode === 'composing' && cmpInput.value.trim())
    ? '<kbd class="kb txt">Enter</kbd>&nbsp; to ' + (cmpModeType === 'adjust' ? 'adjust' : 'derive') : '';
}

/* ---------- the Derive | Adjust mode toggle ----------
   The active segment is the only mode signal — no accent shift, no title.
   Adjust is the featherweight path: one node, one tweak, no count. */
var cmpModeType = 'derive';
function cmpApplyPlaceholder() {
  cmpInput.placeholder = cmpModeType === 'adjust' ? 'One tweak — e.g. 600ms not 200ms'
    : (cmpMode === 'composing' ? 'Describe the change…' : 'Type something...');
}
function setCmpModeType(m) {
  cmpModeType = m;
  var btns = cmpModeEl.children;
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-m') === m);
  document.getElementById('cmpCount').hidden = m === 'adjust';
  cmpGo.textContent = m === 'adjust' ? 'Adjust' : 'Derive';
  cmpApplyPlaceholder();
  cmpSyncInline();
}
for (var mi = 0; mi < cmpModeEl.children.length; mi++) {
  cmpModeEl.children[mi].addEventListener('click', function () {
    setCmpModeType(this.getAttribute('data-m'));
    cmpInput.focus();
  });
}

/* The note reserves no row at rest. Transient messages open it for a beat and
   collapse away; sticky ones (fleet offline) stay until they're cleared. */
var cmpNoteTimer = null, cmpNoteClear = null;
function cmpShowNote(html, ttl) {
  clearTimeout(cmpNoteClear); clearTimeout(cmpNoteTimer);
  cmpNote.innerHTML = html;
  composer.classList.add('noted');
  if (ttl) cmpNoteTimer = setTimeout(cmpHideNote, ttl);
}
function cmpHideNote() {
  clearTimeout(cmpNoteTimer);
  if (!composer.classList.contains('noted')) return;
  composer.classList.remove('noted');
  // hold the text until the row has finished collapsing, so it fades rather than blanking
  clearTimeout(cmpNoteClear);
  cmpNoteClear = setTimeout(function () { cmpNote.innerHTML = ''; }, 340);
}

/* ---------- reference images ----------
   Paste or drop an image into the composer: it uploads into the task's
   images/ folder right away (content-addressed, so repeats are free) and the
   derive request carries the stored paths for the fleet agent to look at. */
var cmpImages = []; // { file: 'images/<hash>.<ext>' | null while uploading, el }
function cmpImagesReady() {
  return cmpImages.every(function (i) { return i.file; });
}
function cmpRemoveImage(item) {
  var i = cmpImages.indexOf(item);
  if (i >= 0) cmpImages.splice(i, 1);
  item.el.remove();
  composer.classList.toggle('has-imgs', !!cmpImages.length);
  syncComposer();
}
function cmpClearImages() { cmpImages.slice().forEach(cmpRemoveImage); }
function cmpAddImage(blob) {
  if (!/^image\/(png|jpeg|gif|webp)$/.test(blob.type)) {
    cmpShowNote('Images only — PNG, JPEG, GIF or WebP.', 3200);
    return;
  }
  var item = { file: null, el: document.createElement('div') };
  item.el.className = 'cmp-img pending';
  var img = document.createElement('img');
  img.src = URL.createObjectURL(blob);
  var up = document.createElement('span');
  up.className = 'up';
  up.innerHTML = '<i></i>';
  var rm = document.createElement('button');
  rm.className = 'rm';
  rm.type = 'button';
  rm.title = 'Remove image';
  rm.textContent = '✕';
  rm.addEventListener('mousedown', function (e) { e.stopPropagation(); });
  rm.addEventListener('click', function (e) { e.stopPropagation(); cmpRemoveImage(item); });
  item.el.appendChild(img); item.el.appendChild(up); item.el.appendChild(rm);
  cmpImgs.appendChild(item.el);
  cmpImages.push(item);
  composer.classList.add('has-imgs');
  syncComposer(); // the chip row changed the panel's height
  fetch(API + '/t/' + TASK + '/images', { method: 'POST', headers: { 'Content-Type': blob.type }, body: blob })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (d) { item.file = d.file; item.el.classList.remove('pending'); })
    .catch(function () {
      cmpRemoveImage(item);
      cmpShowNote('Image upload failed.', 3200);
    });
}
cmpInput.addEventListener('paste', function (e) {
  var files = e.clipboardData && e.clipboardData.files;
  if (!files || !files.length) return;
  e.preventDefault();
  for (var i = 0; i < files.length; i++) cmpAddImage(files[i]);
});
composer.addEventListener('dragover', function (e) { e.preventDefault(); cmpField.classList.add('dropping'); });
composer.addEventListener('dragleave', function (e) { if (!composer.contains(e.relatedTarget)) cmpField.classList.remove('dropping'); });
composer.addEventListener('drop', function (e) {
  e.preventDefault();
  cmpField.classList.remove('dropping');
  var files = e.dataTransfer && e.dataTransfer.files;
  if (!files) return;
  for (var i = 0; i < files.length; i++) cmpAddImage(files[i]);
});

cmpInput.addEventListener('input', function () { cmpHideNote(); cmpLayout(); });
cmpInput.addEventListener('focus', function () { cmpField.classList.add('hot'); });
cmpInput.addEventListener('blur', function () { cmpField.classList.remove('hot'); });

cmpGo.addEventListener('click', doSend);
cmpInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
  // shift is the deliberate form — it works mid-sentence, since "_" and "+" are
  // rare enough in a prompt that holding shift can only have meant the counter
  else if (e.shiftKey && (e.key === '+' || e.key === '=')) { e.preventDefault(); setCmpCount(cmpCount + 1); }
  else if (e.shiftKey && (e.key === '_' || e.key === '-')) { e.preventDefault(); setCmpCount(cmpCount - 1); }
  // bare -/+ only apply to an empty field — mid-sentence they'd eat the character
  else if ((e.key === '+' || e.key === '=') && !cmpInput.value) { e.preventDefault(); setCmpCount(cmpCount + 1); }
  else if ((e.key === '-' || e.key === '_') && !cmpInput.value) { e.preventDefault(); setCmpCount(cmpCount - 1); }
});
function setCmpCount(n, echo) {
  cmpCount = clamp(Math.round(n) || CMP_MIN, CMP_MIN, CMP_MAX);
  if (echo !== false) cmpN.value = String(cmpCount);
  cmpMinus.disabled = cmpCount <= CMP_MIN;
  cmpPlus.disabled = cmpCount >= CMP_MAX;
}
cmpMinus.addEventListener('click', function () { setCmpCount(cmpCount - 1); });
cmpPlus.addEventListener('click', function () { setCmpCount(cmpCount + 1); });
// while typing, track the value but leave the field alone so "1" on the way to "10" isn't clamped out
cmpN.addEventListener('input', function () { if (cmpN.value !== '') setCmpCount(+cmpN.value, false); });
cmpN.addEventListener('blur', function () { setCmpCount(cmpCount); });
cmpN.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); setCmpCount(cmpCount); doDerive(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setCmpCount(cmpCount + 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setCmpCount(cmpCount - 1); }
});
setCmpCount(cmpCount);

for (var ai = 0; ai < ispAspect.children.length; ai++) {
  ispAspect.children[ai].addEventListener('click', function () { setAspect(this.getAttribute('data-a')); });
}
document.getElementById('ispDerive').addEventListener('click', function () {
  if (composer.classList.contains('in-inspect')) closeInspectDerive(); else openInspectDerive();
});
ispPause.addEventListener('click', togglePause);
ispRestart.addEventListener('click', function () { var n = byId(state.inspectId); if (n) buildInspFrame(n); });
ispPick.addEventListener('click', function () { if (state.inspectId != null) setWinner(state.inspectId); });
ispClose.addEventListener('click', closeInspect);
inspect.addEventListener('mousedown', function (e) { if (e.target === inspect) closeInspect(); });

window.addEventListener('keydown', function (e) {
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) {
    if (e.key === 'Escape') t.blur();
    return;
  }
  if (e.key === 'Escape') { escAction(); }
  else if (e.key.indexOf('Arrow') === 0) { e.preventDefault(); handleNavKey(e.key); }
  else if ((e.key === 'Enter' || e.key === ' ') && state.inspectId == null) {
    var open = selPrimary();
    if (open) { e.preventDefault(); openInspect(open.id); }
  }
  else if (e.key === 'i' || e.key === 'I') {
    if (state.inspectId != null) { e.preventDefault(); openInspectDerive(); return; }
    var sel = selPrimary();
    if (!sel) { navArrow('ArrowRight'); sel = selPrimary(); } // nothing selected: start at the first root
    if (sel) { e.preventDefault(); cmpInput.focus(); }
  }
  else if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomBy(1.2); }
  else if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomBy(1 / 1.2); }
  else if (e.key === '0') { e.preventDefault(); fitView(); }
});
window.addEventListener('resize', function () {
  applyCamera();
  if (state.inspectId != null) setAspect(currentAspect);
});
/* keys pressed inside an inspected variant page are forwarded up by the
   withPause-injected hook, so navigation keeps working with the page focused */
window.addEventListener('message', function (ev) {
  var k = ev.data && ev.data.composerKey;
  if (typeof k !== 'string') return;
  if (k === 'Escape') { if (state.inspectId != null) escAction(); }
  else if (k.indexOf('Arrow') === 0) handleNavKey(k);
});

/* ---------- fleet liveness ---------- */
/* derive/pick only work while a fleet agent is heartbeating; without one
   the requests would sit in the file forever, so the board locks them */
var liveEl = document.getElementById('live');
function setLive(v) {
  fleetLive = v;
  liveEl.textContent = v ? '● fleet live' : '○ fleet offline';
  liveEl.classList.toggle('off', !v);
  liveEl.title = v ? 'A fleet agent is listening' : 'No fleet agent — run /composer in the project to reconnect';
  cmpGo.disabled = !v;
  composer.classList.toggle('offline', !v);
  if (!v) cmpShowNote('Fleet offline — run /composer to reconnect.');
  else if (cmpNote.textContent.indexOf('offline') !== -1) cmpHideNote();
}

/* ---------- boot + live sync ---------- */
applyCamera();
document.getElementById('sessName').textContent = SESSION;
fetch(API + '/tasks').then(function (r) {
  if (!r.ok) throw new Error('unknown session');
  return r.json();
}).then(function (info) {
  TASKS = info.tasks || [];
  if (!TASK && TASKS.length) TASK = TASKS[0].slug; // newest task by default
  var sel = document.getElementById('taskSel');
  if (!TASKS.length) {
    var o = document.createElement('option');
    o.textContent = 'no tasks yet';
    sel.appendChild(o);
    sel.disabled = true;
  }
  TASKS.forEach(function (t) {
    var o = document.createElement('option');
    o.value = t.slug;
    o.textContent = 'task: “' + t.title + '”';
    if (t.slug === TASK) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', function () { location.href = '/b/' + SESSION + '?task=' + sel.value; });
  setLive(!!info.live);
  if (!TASK) return;
  document.title = 'Composer — ' + SESSION;
  POS_KEY = 'composer-pos:' + SESSION + ':' + TASK;
  try { savedPos = JSON.parse(localStorage.getItem(POS_KEY) || '{}'); } catch (e) { savedPos = {}; }
  refreshVariants(false).then(refreshRequests);
  var es = new EventSource(API + '/events?task=' + TASK);
  es.onmessage = function (ev) {
    var msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.kind === 'status') setLive(!!msg.live);
    else refreshVariants(true).then(refreshRequests);
  };
  es.onerror = function () { liveEl.textContent = '○ reconnecting…'; liveEl.classList.add('off'); };
}).catch(function () {
  liveEl.textContent = '○ unknown session';
  liveEl.classList.add('off');
});
  </script>
</body>
</html>
