<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Composer</title>
<style>
<!-- @include board.css -->
<!-- @include input.css -->
<!-- @include inspect.css -->
</style>
</head>
<body>
  <div id="canvas">
    <div id="world">
      <svg id="edges"></svg>
    </div>
  </div>

  <div id="hud">
    <div><b><a href="/" title="All sessions">Composer</a></b> · <span id="sessName"></span> · <select id="taskSel" title="Switch task"></select> · <span id="live">○ connecting…</span></div>
  </div>

  <div id="toolbar">
    <button id="tbZoomOut" title="Zoom out ( - )">−</button>
    <button id="tbZoomIn" title="Zoom in ( + )">+</button>
    <button id="tbFit" title="Fit view ( 0 )">Fit</button>
    <button id="tbOrg" title="Tidy the whole board into a tree ( o )">Organize</button>
    <button id="tbPhone" title="Open this task on your phone — navigation stays in sync">Phone</button>
  </div>

  <div id="qrOverlay" hidden>
    <div class="qr-card">
      <canvas id="qrCanvas"></canvas>
      <button id="qrClose" type="button">Close</button>
    </div>
  </div>

  <button id="themeToggle" title="Toggle light / dark" aria-label="Toggle light / dark">☾</button>

  <canvas id="minimap" width="150" height="96"></canvas>

  <div id="composer" hidden>
    <div id="cmpMode">
      <button type="button" data-m="iterate" class="on"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 10V6.6a2 2 0 0 1 2-2h3.2"/><path d="M3.4 4.2V2"/><path d="M7.1 3.1 8.6 4.6 7.1 6.1"/><circle cx="3.4" cy="10.4" r="1.1" fill="currentColor" stroke="none"/></svg><span>Iterate</span></button><button type="button" data-m="tweak"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.4 3.6h3.1M7.1 3.6h3.5M1.4 8.4h4.9M8.9 8.4h1.7"/><circle cx="5.9" cy="3.6" r="1.35"/><circle cx="7.6" cy="8.4" r="1.35"/></svg><span>Tweak</span></button><button id="cmpReject" type="button" title="Reject"><svg class="ban" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="4.6"/><path d="M3 3l6 6"/></svg><svg class="undo" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 6.4a3.6 3.6 0 1 1 1 2.6"/><path d="M2.2 4.1v2.4h2.4"/></svg><span class="lbl">Reject</span></button>
    </div>
    <div class="cmp-imgs" id="cmpImgs"></div>
    <div id="cmpFieldWrap">
    <div id="cmpField">
      <div id="cmpMirror" aria-hidden="true"></div>
      <textarea id="cmpInput" rows="1" placeholder="Type something..."></textarea>
      <div class="cmp-hint" aria-hidden="true">
        <kbd class="kb"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 5.6 6 2.8l2.8 2.8"/><path d="M6 2.9v4.6"/><path d="M3.9 9.5h4.2"/></svg></kbd><kbd class="kb"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.4 3v3.9H3.3"/><path d="M5.3 4.9 3.2 6.9l2.1 2"/></svg></kbd><span class="lbl">newline</span>
      </div>
    </div>
      <div class="dialhost">
        <div id="cmpPop" role="listbox"></div>
        <button id="cmpDial" type="button" aria-haspopup="listbox" title="Which model builds this — click for the list, ← / → to step">
          <span class="emblem" aria-hidden="true"></span><span class="nm"></span>
        </button>
      </div>
    </div>
    <div class="cmp-row">
      <div id="cmpCount">
        <button id="cmpMinus" type="button" title="Fewer variants">−</button>
        <div id="cmpNWrap">
          <input id="cmpN" type="number" min="1" max="12" step="1" value="3" title="How many variants to generate (1–12)" />
          <div id="odo" aria-hidden="true"><span class="slot empty"></span><span class="slot"></span></div>
        </div>
        <button id="cmpPlus" type="button" title="More variants">+</button>
      </div>
      <div id="ladder" aria-hidden="true"></div>
      <div id="cmpInline"></div>
      <div class="cmp-spacer"></div>
      <button id="cmpGo">Iterate</button>
    </div>
    <div id="cmpNote" class="cmp-note"></div>
  </div>

  <div id="inspect" hidden>
    <div class="insp-stage" id="ispStage">
      <div class="insp-frame" id="ispFrame"></div>
      <div class="insp-paused" id="ispPaused" hidden>❚❚ Paused</div>
    </div>

    <button class="insp-nav prev" id="ispPrev" aria-label="Previous variant (←)" title="Previous variant (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="insp-nav next" id="ispNext" aria-label="Next variant (→)" title="Next variant (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>

    <div class="insp-glow" aria-hidden="true"></div>
    <div class="insp-wake left" id="ispWakeL"></div>
    <div class="insp-wake right" id="ispWakeR"></div>
    <div class="insp-zone" id="ispZone"></div>

    <div class="insp-hints" aria-hidden="true">
      <span><kbd>Esc</kbd> close</span>
      <span><kbd>F</kbd> fullscreen</span>
      <span><kbd>I</kbd> iterate</span>
      <span><kbd>←</kbd><kbd>→</kbd> variants</span>
    </div>

    <div class="insp-glass" id="ispGlass">
      <div class="insp-grow" id="ispGrow"></div>
      <div class="insp-bar">
        <div class="insp-ladder-wrap" id="ispLadderWrap">
          <div class="insp-ladder" id="ispLadder" title="Drag or scroll to set the variant count (1–12)"></div>
          <span class="insp-ladder-n" id="ispLadderN"></span>
          <span class="insp-step">
            <button id="ispMinus" title="Fewer variants" aria-label="Fewer variants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <button id="ispPlus" title="More variants" aria-label="More variants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          </span>
        </div>
        <div class="insp-acts">
          <span class="insp-anchor">
            <div class="insp-pop" id="ispAspect">
              <button data-a="16:9" class="on">16:9</button><button data-a="21:9">21:9</button><button data-a="1:1">1:1</button><button data-a="9:16">9:16</button>
            </div>
            <button class="insp-ico" id="ispAspectBtn" title="Aspect ratio">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 6v12"/></svg>
            </button>
          </span>
          <button class="insp-ico" id="ispFull" title="Fullscreen ( F )">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg>
          </button>
          <button class="insp-ico" id="ispShot" title="Screenshot to clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
          </button>
          <button class="insp-ico" id="ispPause" title="Pause">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>
          </button>
          <button class="insp-ico" id="ispRestart" title="Restart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
          </button>
          <span class="insp-sep"></span>
          <button class="insp-ico" id="ispIterate" title="Iterate on this variant ( I )">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <button class="insp-pick" id="ispPick">
          <span id="ispPickLabel">Pick this one</span>
          <svg id="ispPickCheck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
        </button>
        <button class="insp-pick insp-copy" id="ispCopyPrompt" title="Copy a hand-off prompt for a fresh agent" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span>Copy prompt</span>
        </button>
        <button class="insp-ico" id="ispClose" title="Close (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
<!-- @include state.js -->
<!-- @include canvas.js -->
<!-- @include sync.js -->
<!-- @include inspect.js -->
<!-- @include wiring.js -->
<!-- @include remote.js -->
<!-- @include input.js -->
<!-- @include boot.js -->
  </script>
</body>
</html>
